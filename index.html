<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ethan 的学习工作台</title>
<style>
:root{
  --blue:#3FA7FF; --green:#46C99B; --orange:#FF9F43; --yellow:#FFD45E;
  --bg:#F2F8FF; --card:#FFFFFF; --ink:#2E3A4B; --sub:#8A98A8; --line:#E6EEF6;
  --red:#FF6B6B; --good:#46C99B;
  --sbw:0px; /* 左侧导航栏宽度，由媒体查询在 Pad 模式覆盖 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;height:100svh;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
#home{flex:1 1 0%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.header{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;padding:16px 18px 14px;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between}
.header .who{display:flex;align-items:center;gap:10px}
.header .mascot{font-size:30px}
.header .name{font-size:18px;font-weight:700}
.header .stats{display:flex;gap:14px;text-align:center}
.header .stats .s{font-size:13px;opacity:.95}
.header .checklist-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-size:17px;cursor:pointer;flex:0 0 auto;margin-left:2px}
.header .checklist-ic:active{transform:scale(.92);background:rgba(255,255,255,.34)}
.header .stats .s b{display:block;font-size:18px;font-weight:800}
.section{padding:14px 16px}
.section h3{margin:6px 2px 10px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.section h3 .tag{font-size:11px;background:var(--line);color:var(--sub);padding:1px 7px;border-radius:8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(60,120,200,.07);display:flex;align-items:center;gap:12px}
.card .ic{font-size:26px;width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.card .txt{flex:1}
.card .txt .t{font-size:16px;font-weight:700}
.card .txt .d{font-size:12px;color:var(--sub);margin-top:2px}
.card .go{font-size:13px;color:var(--blue);font-weight:700;background:var(--bg);padding:7px 12px;border-radius:20px}
.card.done{position:relative;background:linear-gradient(135deg,#FFF7E0,#FFE9B4);border:2px solid #FFC94B;box-shadow:0 4px 16px rgba(255,180,40,.32);animation:medalGlow 2.2s ease-in-out infinite}
.card.done .ic{background:linear-gradient(135deg,#FFE9B4,#FFD24B)}
.card.done .txt .t{color:#7a5a00}
.card.done .txt .d{color:#a87f1f}
.card.done .go{background:linear-gradient(135deg,#FFD24B,#FF9F1C);color:#fff;animation:medalPulse 1.6s ease-in-out infinite}
.bonusbtn{width:30px;height:30px;border-radius:50%;border:none;background:var(--orange);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(255,159,67,.4);margin-left:2px}
.bonusbtn:active{transform:scale(.92)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--sub);margin-right:5px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:0 0 24px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.task.done .box{background:linear-gradient(135deg,#FFD24B,#FF9F1C);border-color:#FF9F1C;box-shadow:0 2px 6px rgba(255,160,20,.5);font-size:14px}
.task.done .lab{color:#7a5a00;font-weight:800;text-decoration:none}
.task .lab{flex:1;font-size:15px;font-weight:600}
.review-card{background:linear-gradient(135deg,#FFF3E0,#FFE9D6);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.review-card .ic{font-size:28px}
.review-card .txt{flex:1}
.review-card .txt .t{font-size:16px;font-weight:800;color:#E8821E}
.review-card .txt .d{font-size:12px;color:#B98A5E}
.review-card .go{font-size:13px;font-weight:800;color:#fff;background:var(--orange);padding:8px 14px;border-radius:20px}
.review-card.done{outline:2px solid var(--good);outline-offset:-2px}
.review-card .go.done-today{background:var(--good)!important;color:#fff}
.due{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:10px;padding:1px 7px;vertical-align:middle}
/* 首页网格：学习任务每行2个，复习闯关一排3个 */
.tasks-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.review-grid .review-card{flex-direction:column;text-align:center;padding:14px 6px;gap:7px}
.review-grid .review-card .ic{font-size:30px}
.review-grid .review-card .txt .t{font-size:14px;font-weight:800}
.review-grid .review-card .txt .d{font-size:10px;line-height:1.3;margin-top:2px}
.review-grid .review-card .go{font-size:11px;padding:5px 9px;border-radius:14px;margin-top:1px}
.addbtn{position:fixed;right:18px;bottom:90px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,159,67,.5);z-index:30;border:none}
.nav{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 10px rgba(60,120,200,.08)}
.nav button{flex:1;background:none;border:none;padding:8px 0 9px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ni{font-size:21px}
.nav button.on{color:var(--blue)}
.nav button.on .ni{transform:scale(1.12)}
/* 左侧导航栏（Pad 横/竖屏显示，手机隐藏） */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:0;display:none;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:30;overflow:hidden}
.sb-head{padding:20px 16px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sb-title{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden}
.sb-pts{font-size:12px;color:var(--sub);white-space:nowrap}
.sb-pts b{color:var(--orange);font-size:17px;font-weight:800}
.sb-nav{display:flex;flex-direction:column;padding:12px 10px;gap:5px;flex:1 1 auto;overflow-y:auto}
.sidebar button{display:flex;align-items:center;gap:13px;background:none;border:none;padding:13px 14px;border-radius:14px;color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.sidebar button .ni{font-size:22px;flex:0 0 auto;line-height:1}
.sidebar button.on{background:var(--bg);color:var(--blue)}
.sidebar button.on .ni{transform:scale(1.12)}
.sb-label{display:none}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.cal-head .mtitle{font-size:17px;font-weight:800;flex:1;text-align:center}
.cal-head button{background:var(--card);border:none;border-radius:12px;padding:8px 15px;font-size:15px;font-weight:800;color:var(--blue);box-shadow:0 2px 8px rgba(60,120,200,.06)}
.cal-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cal-sum .b{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.cal-sum .b b{display:block;font-size:19px;font-weight:800;color:var(--blue);line-height:1.2}
.cal-sum .b span{font-size:10px;color:var(--sub)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{font-size:11px;color:var(--sub);text-align:center;font-weight:700;padding-bottom:2px}
.cal-cell{background:var(--card);border-radius:12px;min-height:60px;padding:5px 3px 5px;text-align:center;box-shadow:0 2px 6px rgba(60,120,200,.05);border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between}
.cal-cell.blank{background:transparent;box-shadow:none;border-color:transparent}
.cal-cell .dn{font-size:13px;font-weight:800}
.cal-cell.none .dn{color:#C3CFDB;font-weight:600}
.cal-cell .pt{font-size:11px;font-weight:800;color:var(--orange);line-height:1.2}
.cal-cell .pt.zero{color:#D5DEE7}
.cal-cell .bar{height:5px;border-radius:3px;background:var(--line);margin:0 2px;overflow:hidden}
.cal-cell .bar i{display:block;height:100%;border-radius:3px}
.cal-cell.today{border-color:var(--blue)}
.cal-cell.sel{border-color:var(--orange);background:#FFF8EF}
.cal-legend{font-size:11px;color:var(--sub);margin-top:10px;text-align:center}
.cal-legend em{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 3px 0 10px;vertical-align:-1px}
.cal-detail{background:var(--card);border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 3px 10px rgba(60,120,200,.07)}
.cal-detail h4{margin:0 0 4px;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.cal-detail .sub{font-size:12px;color:var(--sub);margin-bottom:10px}
.cal-detail .grp{font-size:13px;font-weight:800;margin:10px 0 6px}
.cal-tag{display:inline-block;font-size:12px;background:var(--bg);color:var(--sub);border-radius:10px;padding:4px 10px;margin:0 6px 6px 0;font-weight:600}
.cal-tag.b{background:#E8F4FF;color:#2E6FD8}
.cal-tag.g{background:#E9F9F2;color:#2FA37B}
.cal-tag.o{background:#FFF1E2;color:#D9822B}
.daytbl{width:100%;border-collapse:collapse;margin:4px 0 2px;font-size:13px}
.daytbl th{text-align:left;color:var(--sub);font-weight:700;font-size:12px;padding:6px 8px;border-bottom:2px solid var(--line)}
.daytbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.daytbl td.dtask{font-weight:600;color:var(--ink)}
.daytbl tr:last-child td{border-bottom:none}
.scoreline{font-size:14px;margin-bottom:6px}
.bonusrow{font-size:13px;padding:3px 0;color:var(--ink)}
.cal-tag.r{background:#FFECEC;color:#E05A5A}
.trend{display:flex;align-items:flex-end;gap:6px;height:82px;margin-top:8px}
.trend .tb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.trend .tb i{display:block;width:100%;background:linear-gradient(180deg,var(--blue),var(--green));border-radius:6px 6px 0 0;min-height:3px}
.trend .tb u{font-size:10px;color:var(--orange);font-weight:800;text-decoration:none}
.trend .tb span{font-size:10px;color:var(--sub)}
/* overlay pages */
.page{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100svh;background:var(--bg);z-index:40;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.show{display:flex;animation:pageIn .22s ease}
@keyframes pageIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 页面内部内容居中限宽，背景铺满视口（不再像弹框） */
.page>.topbar,.page>.content{max-width:480px;margin:0 auto;width:100%}
.app-hidden{display:none!important}
.topbar{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.topbar .back{font-size:16px;color:var(--blue);background:none;border:none}
.topbar .tt{font-size:17px;font-weight:800}
.topbar .rt{margin-left:auto;font-size:13px;color:var(--sub)}
.content{padding:14px 16px;flex:1}
.bigbtn{display:block;width:100%;text-align:left;background:var(--card);border:none;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(60,120,200,.07);font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:12px}
.bigbtn .ic{font-size:26px}
  /* 结算页按钮横排紧凑：避免"回到首页"等大块按钮占满整行 */
  .ge-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .ge-btns .bigbtn{flex:1;min-width:120px;justify-content:center;text-align:center;padding:13px 10px;font-size:15px;font-weight:700;margin-bottom:0}
  .ge-btns .bigbtn .ic{font-size:22px}
  .ge-btns .bigbtn.ghost{background:var(--bg);color:var(--sub);box-shadow:none;font-weight:600}
/* session */
.session{display:flex;flex-direction:column;height:100%}
.session .hero{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-radius:18px;padding:20px;margin:14px 16px;text-align:center}
.session .hero .ti{font-size:20px;font-weight:800;margin-bottom:6px}
.session .hero .enc{font-size:14px;opacity:.9;margin-bottom:14px}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.timer-btn{margin-top:10px;background:rgba(255,255,255,.25);border:none;color:#fff;padding:7px 18px;border-radius:20px;font-size:14px;font-weight:700}
.encourage{text-align:center;font-size:15px;color:var(--sub);margin:auto 16px;line-height:1.7}
.mascot-talk{font-size:46px;text-align:center;margin-bottom:8px}
.finish-btn{margin:14px 16px 24px;background:var(--green);color:#fff;border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:800}
/* lesson picker — 上下两行布局，防窄屏换行 */
.lesson{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.lesson .row1{display:flex;align-items:center;gap:10px}
.lesson .ln{font-size:12px;background:var(--bg);color:var(--sub);border-radius:8px;padding:4px 10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.lesson .lt{flex:1;font-size:16px;font-weight:800;min-width:0;line-height:1.4}
.lesson .go{font-size:13px;font-weight:800;color:#fff;background:var(--blue);padding:8px 15px;border-radius:18px;border:none;white-space:nowrap;flex-shrink:0}
.lesson .chlist{font-size:13px;color:var(--sub);font-weight:500;margin-top:5px;letter-spacing:4px;word-break:keep-all;line-height:1.6}
.lesson.rec{outline:2px solid var(--orange)}
.bookhead{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#E3F0FF,#D6E8FF);border-radius:14px;padding:13px 15px;margin:12px 0 8px;cursor:pointer;user-select:none}
.bookhead.open{background:linear-gradient(135deg,var(--blue),#5FBFEA);color:#fff}
.bookhead .bt{flex:1;font-size:15px;font-weight:800;color:#2E6FD8}
.bookhead.open .bt{color:#fff}
.bookhead .bp{font-size:12px;font-weight:700;color:#5B7FA8;background:rgba(255,255,255,.75);padding:3px 9px;border-radius:10px;white-space:nowrap}
.bookhead .bc{font-size:14px;font-weight:800;color:#2E6FD8}
.bookhead.open .bc{color:#fff}
.stat-card{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.stat-card .stv{font-size:22px;font-weight:800;color:var(--blue);line-height:1.1}
.stat-card .std{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600}
.lesson .st{display:inline-block;font-size:12px;color:var(--good);font-weight:700;margin-top:3px}
/* quiz */
.qchar{font-size:64px;text-align:center;font-weight:800;margin:18px 0;color:var(--ink)}
.qpinyin{text-align:center;font-size:20px;color:var(--blue);font-weight:700;margin-bottom:6px}
.qsent{text-align:center;font-weight:800;font-size:21px;line-height:1.8;margin:14px 6px;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:var(--good);background:#EAFaf3;color:var(--good)}
.opt.wrong{border-color:#ff9800;background:#FFF3E0;color:#b26a00}
.opt.shake{animation:fbSway .5s}
@keyframes fbSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.opt .em{font-size:30px;display:block}
.qprog{text-align:center;font-size:13px;color:var(--sub);margin-bottom:6px}
.qhint{position:relative;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFF1C9,#FFD98A);border:2.5px solid #FFC24B;border-radius:18px;padding:11px 15px;margin:4px 0 14px;font-size:16px;font-weight:800;color:#8A5A00;line-height:1.4;box-shadow:0 4px 0 rgba(255,194,75,.45);text-align:left}
.qhint::before{content:'';position:absolute;top:-11px;left:26px;border:7px solid transparent;border-bottom-color:#FFC24B}
.qhint .hi-ic{font-size:22px;flex:0 0 auto}
.speak-btn{display:block;margin:2px auto 14px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5CC8FF,#3A8DFF);border:none;border-radius:18px;padding:12px 26px;box-shadow:0 4px 0 rgba(58,141,255,.4);cursor:pointer}
.speak-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,141,255,.4)}
.speak-btn{display:block;margin:0 auto 8px;background:var(--blue);color:#fff;border:none;border-radius:30px;padding:10px 22px;font-size:15px;font-weight:700}
.reveal{background:#FFF8E8;border-radius:14px;padding:14px;margin-top:12px;text-align:center;display:none}
.reveal.show{display:block}
.reveal .em{font-size:40px}
.reveal .en{font-size:22px;font-weight:800}
.reveal .zh{font-size:16px;color:var(--sub)}
.next-btn{margin-top:10px;width:100%;background:var(--orange);color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
/* keypad */
.eq{font-size:40px;text-align:center;font-weight:800;margin:20px 0}
.eq .ans{color:var(--blue);border-bottom:3px solid var(--blue);min-width:60px;display:inline-block;min-height:46px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:280px;margin:10px auto}
.keypad button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;font-size:22px;font-weight:800;box-shadow:0 2px 6px rgba(60,120,200,.06)}
.keypad button:active{transform:scale(.96)}
.keypad .ok{background:var(--green);color:#fff;border-color:var(--green)}
.keypad .cl{background:var(--bg);color:var(--sub)}
/* rewards */
.fund{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:12px}
.fund .big{font-size:40px;font-weight:900}
.fund .lbl{font-size:13px;opacity:.95}
.ptsbox{display:flex;gap:10px;margin:14px 0}
.ptscell{flex:1;border-radius:16px;padding:14px 6px;text-align:center;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(60,120,200,.12);display:flex;flex-direction:column;align-items:center;animation:ptsPop .55s cubic-bezier(.34,1.56,.64,1) both}
.ptscell:nth-child(1){background:linear-gradient(135deg,#E8F4FF,#D0EAFF);animation-delay:0s}
.ptscell:nth-child(2){background:linear-gradient(135deg,#FFF3E0,#FFE8CC);animation-delay:.12s}
.ptscell:nth-child(3){background:linear-gradient(135deg,#E8FFE8,#CCFFCC);animation-delay:.24s}
.ptscell .ico{font-size:26px;line-height:1;margin-bottom:3px}
.ptscell .ptxt{display:flex;flex-direction:column;align-items:center}
.ptscell .pv{font-size:32px;font-weight:900;line-height:1.15;display:block}
.ptscell:nth-child(1) .pv{color:#1A7ACC}
.ptscell:nth-child(2) .pv{color:#D97706}
.ptscell:nth-child(3) .pv{color:#2DA44A}
.ptscell .pl{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px;display:block}
@keyframes ptsPop{0%{opacity:0;transform:translateY(16px) scale(.94)}60%{opacity:1;transform:translateY(-5px) scale(1.04)}100%{transform:translateY(0) scale(1)}}

/* 答题反馈 V2：题卡底部轻量小条（原满屏大层已废弃，见 PRD QUIZ-FB-V2） */
#fbOverlay{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);z-index:90;display:none;align-items:center;justify-content:center;padding:10px 20px;border-radius:22px;font-size:18px;font-weight:900;color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.20);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;text-align:center;white-space:nowrap;max-width:94vw}
#fbOverlay.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#fbOverlay.ok{background:linear-gradient(90deg,#2ecc71,#27ae60)}
#fbOverlay.no{background:linear-gradient(90deg,#ffa06b,#ff7a45)}
#fbOverlay .fb-msg{white-space:nowrap}
/* 答案内联高亮小药丸：避免「主文案+答案」挤成两行 */
#fbOverlay .fb-ans{font-weight:900;background:rgba(255,255,255,.26);padding:1px 9px;border-radius:10px;margin-left:3px}
/* 答对：在答案上画钩（右上角小勾徽章） */
.opt,.eq .ans{position:relative}
.tick{position:absolute;right:-9px;top:-9px;width:34px;height:34px;pointer-events:none;overflow:visible;filter:drop-shadow(0 3px 8px rgba(46,204,113,.45))}
.tick .tc{transform-origin:center;transform:scale(0);animation:tickPop .3s cubic-bezier(.2,1.7,.4,1) forwards}
.tick .tp{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:tickDraw .3s .2s cubic-bezier(.65,0,.45,1) forwards}
@keyframes tickPop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes tickDraw{to{stroke-dashoffset:0}}
/* 闯关进度条 + 连击（进度=第几题/总题数，答错不倒退） */
.qbar{height:12px;background:#eef1f7;border-radius:10px;overflow:hidden;margin:2px 0 6px}
.qbar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4a7dff,#2ecc71);border-radius:10px;transition:width .45s cubic-bezier(.2,1.4,.4,1)}

.eq .ans.bad{color:#b26a00;border-bottom-color:#ff9800}
.confetti{position:absolute;top:-10%;will-change:transform;animation:fbFall 1.15s linear forwards}
@keyframes fbPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes fbShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-18px) rotate(-8deg)}30%{transform:translateX(18px) rotate(8deg)}45%{transform:translateX(-13px)}60%{transform:translateX(13px)}75%{transform:translateX(-7px)}90%{transform:translateX(7px)}}
@keyframes fbFall{to{transform:translateY(118vh) rotate(380deg);opacity:.2}}
.toast.show{opacity:1}

function _syncBadge(state){
  try{
    var b = document.getElementById('syncBadge');
    if(!b){
      b = document.createElement('div');
      b.id = 'syncBadge';
      b.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99990;font:600 11px/1.4 -apple-system,sans-serif;padding:5px 9px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;opacity:.92';

    }
    if(state==='ok'){ b.textContent='☁️ 已同步'; b.style.background='#2ecc71'; b.style.color='#fff'; }

function cloudInit(){
  return new Promise(function(res){
    try{
      if(typeof cloudbase==='undefined'){ _cloudErr='cloudbase 未定义(SDK未加载)'; res(false); return; }
      // IIFE 包导出结构为 { default: { init, ... } }；必须作为「方法」调用 raw.init() 以保住 this，
      // 否则会抛 "this.useDefaultAdapter is not a function"。
      var raw = (cloudbase && typeof cloudbase==='object' && cloudbase.default) ? cloudbase.default : cloudbase;
      var app;
      if (raw && typeof raw.init==='function'){
        app = raw.init({ env: CLOUD.env });        // 关键：保留 this
      } else if (typeof raw==='function'){
        app = raw({ env: CLOUD.env });
      } else {
        _cloudErr = 'cloudbase 导出结构异常: ' + (raw ? Object.keys(raw).join(',') : 'undefined');

function cloudPush(){
  if(!CLOUD.ready){
    if(_syncBadge) _syncBadge('local');
    return;
  }
  if(_syncBadge) _syncBadge('wait');
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(function(){
    try{
      S.ts = Date.now();
      CLOUD.db.collection(CLOUD.coll).doc(CLOUD.docId).set({ data: S, ts: S.ts })

        .catch(function(err){ _cloudErr = String((err&&err.message)||err); if(_syncBadge) _syncBadge('err'); });

    }catch(e){ _cloudErr = String(e); if(_syncBadge) _syncBadge('err'); }
  }, 700);
}
function cloudPull(){
  if(!CLOUD.ready) return Promise.resolve();
  return CLOUD.db.collection(CLOUD.coll).doc(CLOUD.docId).get().then(function(r){

    if(rec && rec.data){

        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}

// ---------- 积分流水（按天记录，供日历统计） ----------
function addPoints(n, reason, dateStr){
  n = Number(n)||0;
  S.points = Math.max(0, S.points + n);
  syncSidebar();
  const d = dateStr || today();
  if(!S.pointLog) S.pointLog = {};
  const rec = S.pointLog[d] || (S.pointLog[d] = {earn:0, spend:0, items:[]});
  if(n >= 0) rec.earn += n; else rec.spend += -n;
  rec.items.push({n:n, r:reason||''});
  if(rec.items.length > 60) rec.items.splice(0, rec.items.length-60);
  if(!S._bc) checkDailyBonuses();
}
function undoPoints(n, reason, dateStr){
  // 取消勾选：扣回分数并从当天流水移除一条同因记录
  n = Number(n)||0;
  S.points = Math.max(0, S.points - n);
  syncSidebar();
  const d = dateStr || today();
  const rec = S.pointLog && S.pointLog[d];
  if(rec){
    rec.earn = Math.max(0, rec.earn - n);
    const i = rec.items.map(x=>x.r).lastIndexOf(reason);
    if(i >= 0) rec.items.splice(i,1);
  }
}
// 累计净积分（总积分）：遍历 pointLog 所有日期的 (earn - spend) 累加，扣分会减少总分
function totalEarned(){
  let s=0; const pl=S.pointLog||{};
  for(const k in pl){ if(pl[k]){ s += (pl[k].earn||0) - (pl[k].spend||0); } }
  return s;
}
// 已兑换积分：遍历 rewardLog 的 pts 累加
function totalRedeemed(){
  let s=0; (S.rewardLog||[]).forEach(r=>{ s += rewardPts(r); });
  return s;
}
function rewardPts(r){ return r.pts!=null ? r.pts : (r.yuan||0)*5; }

function addDays(n){ const d=new Date(); d.setTime(d.getTime()+n*DAY); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 生成选择题选项：先确保正确答案在候选池，再整体随机打乱取 n 项，使正确答案位置每次随机（不再固定在末尾）
function pickOpts(correct, distractors, n){
  n=n||4;
  const pool=shuffle((distractors||[]).filter(x=> x!==correct && x!==undefined && x!==null && x!==''));
  const taken=pool.slice(0, Math.max(0, n-1));
  return shuffle([correct].concat(taken));
}

function playTone(kind){

    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=playTone._c||(playTone._c=new AC());
    if(ctx.state==='suspended') ctx.resume();

        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
        const s=t+i*0.10;
        g.gain.setValueAtTime(0.0001,s);
        g.gain.exponentialRampToValueAtTime(0.30,s+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.25);
        o.start(s); o.stop(s+0.27);
      });
    } else if(kind==='page'){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(660,t+0.08);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
      o.start(t); o.stop(t+0.14);
    } else if(kind==='cheer'){
      [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
        const s=t+i*0.09;
        g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.30,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.30);
        o.start(s); o.stop(s+0.32);
      });
    } else {
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(110,t+0.35);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t);

  }catch(e){}
}

const SEED_PROGRESS = {2:'all', 3:'all', 4:'all'};
const SEED_VERSION = 3;
function bookOf(n){ return D.hanzi.find(b=> b.book===n); }
function bookProgress(n){
  const b=bookOf(n); if(!b) return {done:0,total:0};
  let done=0; b.lessons.forEach(l=>{ if(S.lessonsDone['b'+n+'l'+l.n]) done++; });
  return {done:done, total:b.lessons.length};
}
// 把某册的 1~upto 课标记为已学；upto=0 表示清除本册进度
function setBookProgress(n, upto, opts){
  opts=opts||{};
  const b=bookOf(n); if(!b) return {lessons:0, chars:0};
  let ln=0, cn=0, i=(opts.startIndex||0);
  b.lessons.forEach(l=>{
    const id='b'+n+'l'+l.n;
    if(l.n<=upto){
      if(!S.lessonsDone[id]){ S.lessonsDone[id]= opts.date || 'seed'; ln++; }
      l.chars.forEach((c,ci)=>{
        const cid=id+'i'+ci;
        if(!S.hanziSchedule[cid]){
          // 历史学过的字：给高复习等级，到期日在未来 14 天内错峰铺开，避免一次涌出上千字
          S.hanziSchedule[cid]={due: addDays(i % 14), level: (opts.level!==undefined? opts.level : (n<=4?4:3))};
          i++; cn++;
        }
      });
    } else if(opts.clearBeyond){
      if(S.lessonsDone[id]==='seed') delete S.lessonsDone[id];
      l.chars.forEach((c,ci)=>{ delete S.hanziSchedule[id+'i'+ci]; });
    }
  });
  return {lessons:ln, chars:cn, nextIndex:i};
}

function enBookWords(bookKey){ return (EN_BOOKS[bookKey]||[]).slice(); }
function enEnabledWords(){
  const books = (S.challengeCfg && S.challengeCfg.en && S.challengeCfg.en.books) || [];
  const seen={}; const out=[];
  books.forEach(b=> enBookWords(b).forEach(w=>{ if(!seen[w.en]){ seen[w.en]=1; out.push(w); } }));
  return out;
}

// ---------- 任务查找 ----------
function allTasks(){ return [].concat(S.tasks.learning||[], S.tasks.lifeHabits||[], S.tasks.lifeSports||[]); }
function taskById(id){ return allTasks().find(t=>t.id===id); }

// ---------- 家庭连续天数 ----------
function streakOf(taskId){
  const arr=(S.doneDates[taskId]||[]).slice().sort();
  if(!arr.length) return 0;
  let streak=0; let cur=new Date(); cur.setHours(0,0,0,0);
  // 允许今天或昨天的最后打卡
  function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  let last=dstr(cur);
  // 若今天没打卡，从昨日起算
  if(!arr.includes(last)){ cur.setTime(cur.getTime()-DAY); last=dstr(cur); }
  for(let i=arr.length-1;i>=0;i--){
    if(arr[i]===last){ streak++; cur.setTime(cur.getTime()-DAY); last=dstr(cur); }
    else if(arr[i] < last){ break; }
  }
  return streak;
}

function checkBackupReminder(){
  const hasData = S.points>0 || (S.doneDates && Object.keys(S.doneDates).length>0);
  if(!hasData) return;
  const todayStr=today();
  if(S.backupRemindedOn===todayStr) return;
  const daysSince = S.lastBackup? Math.round((new Date(todayStr)-new Date(S.lastBackup))/DAY) : 999;
  const earnedSince = S.lastBackup? (S.points - (S.pointsAtBackup||0)) : S.points;
  if(daysSince>=7 || earnedSince>=50){
    S.backupRemindedOn=todayStr; save();
    toast('💾 记得备份数据哦：家长中心 → 备份 / 导入');
  }
}

// ---------- 数学 14 题型生成（覆盖 100 以内加减 + 乘法口诀） ----------
const MATH_TYPES = [
  {k:'add10',  label:'10以内加法'},
  {k:'sub10',  label:'10以内减法'},
  {k:'add20nc',label:'20以内不进位加法'},
  {k:'sub20nb',label:'20以内不退位减法'},
  {k:'a2_1nc', label:'两位数+一位数 不进位加法'},
  {k:'a2_1c',  label:'两位数+一位数 进位加法'},
  {k:'s2_1nb', label:'两位数-一位数 不退位减法'},
  {k:'s2_1b',  label:'两位数-一位数 退位减法'},
  {k:'a2_2nc', label:'两位数+两位数 不进位加法'},
  {k:'a2_2c',  label:'两位数+两位数 进位加法'},
  {k:'s2_2nb', label:'两位数-两位数 不退位减法'},
  {k:'s2_2b',  label:'两位数-两位数 退位减法'},
  {k:'tens',   label:'整十数加减'},
  {k:'mul',    label:'乘法口诀'}
];
function genMathByType(t){
  const rnd=(a,b)=> a+Math.floor(Math.random()*(b-a+1));
  for(let i=0;i<200;i++){
    if(t==='add10'){ const a=rnd(1,9),b=rnd(1,9); if(a+b<=10) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='sub10'){ const a=rnd(2,10),b=rnd(1,a); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='add20nc'){ const a=rnd(10,19),b=rnd(1,9); if((a%10)+b<=9 && a+b<=20) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='sub20nb'){ const a=rnd(11,20); const u=a%10; const b=rnd(1,u); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='a2_1nc'){ const a=rnd(10,99); const b=rnd(1,9); if((a%10)+b<=9) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='a2_1c'){ const a=rnd(10,99); const b=rnd(1,9); if((a%10)+b>=10) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='s2_1nb'){ const a=rnd(10,99); const u=a%10; if(u===0) continue; const b=rnd(1,u); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='s2_1b'){ const a=rnd(10,99); const u=a%10; if(u===0) continue; const b=rnd(u+1,9); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='a2_2nc'){ const a=rnd(10,99),b=rnd(10,99); if((a%10)+(b%10)<=9) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='a2_2c'){ const a=rnd(10,99),b=rnd(10,99); if((a%10)+(b%10)>=10) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='s2_2nb'){ const a=rnd(10,99),b=rnd(10,99); if(a>=b && (a%10)>=(b%10)) return {q:a+'-'+b,ans:a-b}; }
    else if(t==='s2_2b'){ let a=rnd(10,99),b=rnd(10,99); if(a<b){ const t2=a;a=b;b=t2; } if((a%10)<(b%10)) return {q:a+'-'+b,ans:a-b}; }
    else if(t==='tens'){ if(Math.random()<0.5){ const a=rnd(1,9)*10,b=rnd(1,9)*10; return {q:a+'+'+b,ans:a+b}; } else { const a=rnd(2,9)*10,b=rnd(1,Math.floor(a/10))*10; return {q:a+'-'+b,ans:a-b}; } }
    else if(t==='mul'){ const a=rnd(1,9),b=rnd(1,9); return {q:a+'×'+b,ans:a*b}; }
  }
  const a=rnd(1,9),b=rnd(1,9); return {q:a+'+'+b,ans:a+b};
}
// ---------- 通用选择题（点选式，答错给一次重试，再错揭示正确答案） ----------
function choiceQ(body, opts){
  body.innerHTML='';
  const prog=document.createElement('div'); prog.className='qprog'; body.appendChild(prog);
  const refresh=()=>{ prog.textContent='第 '+opts.stat.idx+' / '+opts.stat.total+'　对 '+opts.stat.right+'　错 '+opts.stat.wrong; };
  refresh();
  const ui=quizBar(body, opts.stat);
  body.appendChild(hintBubble(opts.hint));
  if(opts.speak){
    const sp=document.createElement('button');
    sp.className='speak-btn'; sp.type='button'; sp.textContent='🔊 听单词';
    sp.onclick=()=>{ try{ opts.speak(); }catch(e){} };
    body.appendChild(sp);
  }
  if(opts.head){ const hd=document.createElement('div'); hd.style.cssText='text-align:center;margin:6px 0'; hd.innerHTML=opts.head; body.appendChild(hd); }
  if(opts.review){
    const wrap=document.createElement('div'); wrap.className='opts'; body.appendChild(wrap);
    const wrongSet=new Set(opts.wrongChoices||[]);
    opts.choices.forEach(label=>{
      const b=document.createElement('div'); b.className='opt'; b.textContent=label;
      if(label===opts.answer){
        b.classList.add(opts.ok ? 'correct' : 'correct-hint');   // 最终答对→绿框(实线)；最终答错→绿色虚线提示样式
      } else if(wrongSet.has(label)){
        b.classList.add('wrong');                                // 答错选项红框(可多个)
      }
      wrap.appendChild(b);
    });
    const tag=document.createElement('div'); tag.className='qresult '+(opts.ok?'ok':'no');
    tag.textContent= opts.ok?'✔ 你答对了':'✘ 你答错了（正确答案：'+opts.answer+'）';
    body.appendChild(tag);
    return;
  }
  let tries=0;
  const wrap=document.createElement('div'); wrap.className='opts'; body.appendChild(wrap);
  opts.choices.forEach(label=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=label;
    b.onclick=()=>{
      if(opts.capture) opts.capture(label, label===opts.answer);
      if(label===opts.answer){
        [...wrap.children].forEach(x=> x.onclick=null);
        b.classList.add('correct');
        drawTick(b);
        if(tries===0){                       // 一次答对 → 记对
          opts.stat.combo = (opts.stat.combo||0)+1;
          opts.stat.right++; refresh();
          showFeedback(true, ()=> opts.onDone(true));
        } else {                             // 曾答错→最终选对：显示对，记错层生效
          opts.stat.combo=0; ui.combo();
          opts.stat.wrong++; refresh(); ui.step();
          showFeedback(true, ()=> opts.onDone(false, true), '本次答对了，但前面答错过，已记入错题');
        }
      } else {
        b.classList.add('wrong','shake'); playTone('wrong');
        setTimeout(()=> b.classList.remove('shake'), 650);   // 仅停抖动，保留 wrong 红框
        opts.stat.combo=0; ui.combo();
        tries++;
        if(tries>=2){
          [...wrap.children].forEach(x=> x.onclick=null);
          [...wrap.children].forEach(x=>{ if(x.textContent===opts.answer) x.classList.add('correct-hint'); });  // 正确选项绿色虚线提示样式
          opts.stat.wrong++; refresh(); ui.step();
          showFeedback(false, ()=> opts.onDone(false), '正确答案：'+opts.answer);
        } else {
          showFeedback(false, null, '还有 '+(2-tries)+' 次机会');
        }
      }
    };
    wrap.appendChild(b);
  });
}
// ---------- 通用数学键盘题（大按钮数字键盘，答错给一次重试） ----------
function mathQ(body, opts){
  body.innerHTML='';
  const prog=document.createElement('div'); prog.className='qprog'; body.appendChild(prog);
  const refresh=()=>{ prog.textContent='第 '+opts.stat.idx+' / '+opts.stat.total+'　对 '+opts.stat.right+'　错 '+opts.stat.wrong; };
  refresh();
  const ui=quizBar(body, opts.stat);
  body.appendChild(hintBubble(opts.hint));
  let input='';
  const eq=document.createElement('div'); eq.className='eq'; eq.innerHTML=esc(opts.q)+' = <span class="ans"></span>'; body.appendChild(eq);
  if(opts.review){
    eq.querySelector('.ans').textContent = (opts.userAns===undefined||opts.userAns==='') ? '—' : opts.userAns;
    eq.querySelector('.ans').classList.add(opts.ok?'correct':'wrong');
    const tag=document.createElement('div'); tag.className='qresult '+(opts.ok?'ok':'no');
    tag.textContent= opts.ok?'✔ 你答对了':'✘ 你答错了（正确答案 '+opts.ans+'）';
    body.appendChild(tag);
    return;
  }
  const kp=document.createElement('div'); kp.className='keypad';
  ['1','2','3','4','5','6','7','8','9','清除','0','✓'].forEach(k=>{
    const b=document.createElement('button'); b.textContent=k;
    if(k==='✓') b.className='ok'; if(k==='清除') b.className='cl';
    b.onclick=()=>{
      if(k==='清除') input='';
      else if(k==='✓'){ check(); return; }
      else if(input.length<5){ if(tries>0) input=''; input+=k; }   // 重试时覆盖式输入
      eq.querySelector('.ans').textContent=input;
    };
    kp.appendChild(b);
  });
  body.appendChild(kp);
  let tries=0;
  function check(){
    if(input==='') return;
    const ok = parseInt(input,10)===opts.ans;
    if(opts.capture) opts.capture(input, ok);
    const ansEl = eq.querySelector('.ans');
    if(ok){
      [...kp.children].forEach(x=> x.disabled=true);
      drawTick(ansEl);
      if(tries===0){                       // 一次答对 → 记对
        opts.stat.combo = (opts.stat.combo||0)+1;
        opts.stat.right++; refresh();
        showFeedback(true, ()=> opts.onDone(true));
      } else {                             // 曾答错→最终选对：显示对，记错层生效
        opts.stat.combo=0; ui.combo();
        opts.stat.wrong++; ui.step();
        showFeedback(true, ()=> opts.onDone(false, true), '本次答对了，但前面答错过，已记入错题');
      }
    } else {
      opts.stat.combo=0; ui.combo();
      ansEl.classList.add('bad');          // 保持红框(不自动移除)
      tries++;
      refresh();
      if(tries>=2){
        ansEl.textContent=opts.ans;        // 显示正确值
        ansEl.classList.remove('bad'); ansEl.classList.add('correct-hint');  // 绿色虚线提示样式
        opts.stat.wrong++; ui.step();
        showFeedback(false, ()=> opts.onDone(false), '正确答案 '+opts.ans);
      } else {
        showFeedback(false, null, '还有 '+(2-tries)+' 次机会');  // 保留红框+错误值，重试覆盖输入
      }
    }
  }
}

// ---------- 语文闯关（看字选拼音 / 听音选字 / 组词填空 随机混合） ----------
function startHanziChallenge(resume){
  const c=S.challengeCfg.hanzi||{};
  const books=Array.from(new Set([...(c.books||[]),7]));
  if(!books.length){ toast('请家长先到「家长中心 → 闯关配置」选择册'); return; }
  const qty=Math.max(1, c.qty||10);
  // 复习池 = 家长在闯关配置中选择的册里的全部字（不再依赖"学习完成"自动排程）
  const cids=[];
  for(const b of books){ for(const ch of ALLCH){ if(ch.id.indexOf('b'+b+'l')===0) cids.push(ch.id); } }
  if(!cids.length){ toast('请家长先到「家长中心 → 闯关配置」选择册'); return; }
  // 错题本：孩子答错过的字按艾宾浩斯再考，且同样只限家长选择的册
  const dueWrong=dueWrongHanzi().filter(cid=> books.some(b=> cid.indexOf('b'+b+'l')===0));
  const nWrong=Math.min(qty, dueWrong.length);
  const wrongPicks=shuffle(dueWrong).slice(0, nWrong);
  const wrongSet=new Set(wrongPicks);
  // 新字：已选册字 − 今日错题，随机抽
  const newPool=shuffle(cids.filter(cid=> !wrongSet.has(cid)));
  const nNew=Math.max(0, qty-nWrong);
  const newPicks=newPool.slice(0, nNew);
  // 合并打乱；标记哪些来自错题本（用于答对时推进间隔）
  const body=$('hanziMenu');
  let resumeMuted = !!resume;               // 续关进入时先静音，等用户点"接着做"再播放当前题
  let picks, stat, history, answeredCount, cur, wrongFlag={};
  if(resume && resume.kind==='hanzi' && resume.items){
    picks=(resume.picks||[]).slice();
    wrongFlag = resume.wrongFlag || {};
    stat={idx:resume.stat.idx,total:resume.stat.total,right:resume.stat.right,wrong:resume.stat.wrong};
    answeredCount=resume.answeredCount; cur=resume.cur;
    history=resume.items.map(it=>{
      if(!it) return {answered:false, spec:null, cid:undefined, isWrong:false, wrongChoices:[]};
      return {answered:!!it.answered, ok:it.ok, userAns:it.userAns, wrongChoices:it.wrongChoices||[], cid:it.cid, isWrong:!!it.isWrong,
        spec: it.spec ? {head:it.spec.head,hint:it.spec.hint,choices:it.spec.choices,answer:it.spec.answer,speakInfo:it.spec.speakInfo||null,speak:speakFrom(it.spec.speakInfo||null)} : null};
    });
  } else {
    wrongPicks.forEach(cid=> wrongFlag[cid]=true);
    picks=shuffle(wrongPicks.concat(newPicks));
    stat={idx:0,total:picks.length,right:0,wrong:0};
    history=[]; answeredCount=0; cur=0;
  }
  function renderNav(){
    const nav=document.createElement('div'); nav.className='qnav';
    const prev=document.createElement('button'); prev.className='qnavbtn'; prev.textContent='← 上一题';
    prev.disabled = cur<=0; prev.onclick=()=>{ if(cur>0) viewQuestion(cur-1); };
    const nxt=document.createElement('button'); nxt.className='qnavbtn'; nxt.textContent='下一题 →';
    nxt.disabled = cur>=answeredCount; nxt.onclick=()=>{ if(cur<answeredCount) viewQuestion(cur+1); };
    nav.appendChild(prev); nav.appendChild(nxt); body.appendChild(nav);
  }
  function viewQuestion(i){
    if(i>=stat.total){ challengeEnd('hanzi', stat.right, stat.wrong, ()=>startHanziChallenge()); return; }
    cur=i; stat.idx=i+1;
    if(i < answeredCount){                       // 回看已答
      const h=history[i];
      choiceQ(body, {hint:h.spec.hint, head:h.spec.head, choices:h.spec.choices, answer:h.spec.answer, stat, review:true, userAns:h.userAns, wrongChoices:h.wrongChoices, ok:h.ok, speak:h.spec.speak});
      renderNav();
      if(!resumeMuted && h.spec.speak) setTimeout(()=>{ try{ h.spec.speak(); }catch(e){} }, 350);
      return;
    }
    let h=history[i];
    let cid, ch, spec, isWrong;
    if(h && h.spec){ // 续关：曾经查看过但当时未答（退出时停在这一题）
      cid=h.cid; ch=CHMAP[cid]; spec=h.spec; isWrong=h.isWrong;
    } else {
      cid=picks[i]; const ch2=CHMAP[cid];
      if(!ch2){ viewQuestion(i+1); return; }
      ch=ch2;
      let type=HANZI_TYPES[Math.floor(Math.random()*HANZI_TYPES.length)];
      spec=hanziQSpec(type, ch);
      let _guard=0;
      while((type==='wordfill'||type==='wordpick') && spec.choices.length<4 && _guard<10){
        const _alt=HANZI_TYPES.filter(t=>t!=='wordfill'&&t!=='wordpick');
        type=_alt[Math.floor(Math.random()*_alt.length)];
        spec=hanziQSpec(type, ch);
        _guard++;
      }
      const speakInfo=(type==='listen')?{t:ch.c,l:'zh-CN',r:0.7}:null;
      isWrong=!!wrongFlag[cid];
      h={answered:false, spec:{head:spec.head,hint:spec.hint,choices:spec.choices,answer:spec.answer,speakInfo,speak:speakFrom(speakInfo)}, cid, isWrong, userAns:null};
      history[i]=h;
    }
    choiceQ(body, {
      hint:spec.hint, head:spec.head, choices:spec.choices, answer:spec.answer, stat,
      capture:(label, isCorrect)=>{
        h.userAns=label;
        if(!isCorrect){
          h.wrongChoices=h.wrongChoices||[];
          if(!h.wrongChoices.includes(label)) h.wrongChoices.push(label);
        }
      },
      onDone:(ok, displayedOk)=>{
        h.answered=true; h.ok=(displayedOk!==undefined?displayedOk:ok);
        answeredCount=Math.max(answeredCount, i+1);
        updateWrongHanzi(cid, ok, isWrong);
        persist();
        viewQuestion(answeredCount);
      },
      speak:spec.speak
    });
    renderNav();
    if(!resumeMuted && spec.speak) setTimeout(()=>{ try{ spec.speak(); }catch(e){} }, 350);
  }
  function persist(){
    const items=[];
    for(let i=0;i<stat.total;i++){
      const it=history[i];
      if(!it){ items.push(null); continue; }
      items.push({answered:it.answered, ok:it.ok, userAns:it.userAns, wrongChoices:(it.wrongChoices&&it.wrongChoices.length)?it.wrongChoices:undefined, cid:it.cid, isWrong:it.isWrong,
        spec: it.spec ? {head:it.spec.head,hint:it.spec.hint,choices:it.spec.choices,answer:it.spec.answer,speakInfo:it.spec.speakInfo||null} : undefined});
    }
    if(!S.challengeProgress) S.challengeProgress={};
    S.challengeProgress.hanzi={ date:today(), fp:challengeFp('hanzi'), kind:'hanzi', total:stat.total, answeredCount, cur:answeredCount, stat:{idx:stat.idx,total:stat.total,right:stat.right,wrong:stat.wrong}, picks, wrongFlag, items };
    save();
  }
  const controller={
    resumeSpeak:()=>{
      resumeMuted=false;
      const h=history[cur];
      if(h && h.spec && h.spec.speak) try{ h.spec.speak(); }catch(e){}
    }
  };
  viewQuestion(cur);
  return controller;
}

      capture:(v, isCorrect)=>{ history[i].userAns=v; },

        persist();
        viewQuestion(answeredCount);
      }});
    renderNav();

  function persist(){
    const items=[];
    for(let i=0;i<stat.total;i++){
      const it=history[i];
      if(!it){ items.push(null); continue; }
      items.push({answered:it.answered, ok:it.ok, userAns:it.userAns, wrongChoices:(it.wrongChoices&&it.wrongChoices.length)?it.wrongChoices:undefined, q:it.q, ans:it.ans});

}
// ---------- 英语闯关（听音选词 / 看图选词 / 看图+词选中文 / 看中文选词 随机混合） ----------
function startEnChallengeV2(resume){
  const words=enEnabledWords();
  if(!words.length){ toast('请家长先到「家长中心 → 闯关配置」启用单词书'); return; }
  const qty=(S.challengeCfg.en.qty)||20;
  let pool=shuffle(words).slice(0, Math.max(1,qty));
  const body=$('wordsBody');
  let resumeMuted = !!resume;
  let stat, history, answeredCount, cur;
  if(resume && resume.kind==='en' && resume.items){
    pool=(resume.pool||[]).slice();
    stat={idx:resume.stat.idx,total:resume.stat.total,right:resume.stat.right,wrong:resume.stat.wrong};
    answeredCount=resume.answeredCount; cur=resume.cur;
    history=resume.items.map(it=>{
      if(!it) return {answered:false, spec:null, wrongChoices:[]};
      return {answered:!!it.answered, ok:it.ok, userAns:it.userAns, wrongChoices:it.wrongChoices||[],
        spec: it.spec ? {head:it.spec.head,hint:it.spec.hint,choices:it.spec.choices,answer:it.spec.answer,speakInfo:it.spec.speakInfo||null,speak:speakFrom(it.spec.speakInfo||null)} : null};
    });
  } else {
    stat={idx:0,total:pool.length,right:0,wrong:0};
    history=[]; answeredCount=0; cur=0;
  }
  function genEnSpec(w){
    const others=words.filter(x=>x.en!==w.en);
    let type=['listen','pic','piczh','zh','listenzh'][Math.floor(Math.random()*5)];
    if((type==='pic'||type==='piczh') && !w.img) type=(type==='pic')?'listen':'zh';
    const picHead='<div class="qchar" style="font-size:72px">'+(w.img?'<img src="'+w.img+'" style="max-width:160px;max-height:160px;border-radius:14px">':(w.em||'📝'))+'</div>';
    // BUG-001 复发防护：局部变量禁止命名为 speak（会遮蔽全局 speak 函数导致箭头函数自引用无限递归 → 静音）。统一用 speakFn，与 hanziQSpec 保持一致。
    let hint, head, choices, answer, speakFn;
    if(type==='listen'){
      const dist=shuffle(others.map(x=>x.en)).slice(0,3);
      hint='🔊 听单词，选出你听到的英文'; choices=shuffle([w.en].concat(dist)); answer=w.en; speakFn=()=>speak(w.en,'en-US',0.6);
    } else if(type==='pic'){
      const dist=shuffle(others.map(x=>x.en)).slice(0,3);
      hint='🖼️ 看图片，选出对应的英文'; head=picHead; choices=shuffle([w.en].concat(dist)); answer=w.en;
    } else if(type==='piczh'){
      head=picHead+'<div class="qpinyin">'+esc(w.en)+'</div>';
      const dist=shuffle(others.map(x=>x.zh)).slice(0,3);
      hint='🔤 看图+英文，选出它的中文意思'; choices=shuffle([w.zh].concat(dist)); answer=w.zh;
    } else if(type==='listenzh'){
      const dist=shuffle(others.map(x=>x.zh)).slice(0,3);
      hint='🔊 听单词，选出它的中文意思'; choices=shuffle([w.zh].concat(dist)); answer=w.zh; speakFn=()=>speak(w.en,'en-US',0.6);
    } else {
      head='<div class="qchar" style="font-size:40px">'+esc(w.zh)+'</div>';
      const dist=shuffle(others.map(x=>x.en)).slice(0,3);
      hint='🔤 看中文，选出对应的英文'; choices=shuffle([w.en].concat(dist)); answer=w.en;
    }
    return {hint, head, choices, answer, speak:speakFn};
  }
  function renderNav(){
    const nav=document.createElement('div'); nav.className='qnav';
    const prev=document.createElement('button'); prev.className='qnavbtn'; prev.textContent='← 上一题';
    prev.disabled = cur<=0; prev.onclick=()=>{ if(cur>0) viewQuestion(cur-1); };
    const nxt=document.createElement('button'); nxt.className='qnavbtn'; nxt.textContent='下一题 →';
    nxt.disabled = cur>=answeredCount; nxt.onclick=()=>{ if(cur<answeredCount) viewQuestion(cur+1); };
    nav.appendChild(prev); nav.appendChild(nxt); body.appendChild(nav);
  }
  function viewQuestion(i){
    if(i>=stat.total){ challengeEnd('en', stat.right, stat.wrong, ()=>startEnChallengeV2()); return; }
    cur=i; stat.idx=i+1;
    if(i < answeredCount){
      const h=history[i];
      choiceQ(body, {hint:h.spec.hint, head:h.spec.head, choices:h.spec.choices, answer:h.spec.answer, stat, review:true, userAns:h.userAns, wrongChoices:h.wrongChoices, ok:h.ok, speak:h.spec.speak});
      renderNav();
      if(!resumeMuted && h.spec.speak) setTimeout(()=>{ try{ h.spec.speak(); }catch(e){} }, 350);
      return;
    }
    let h=history[i];
    let w, spec;
    if(h && h.spec){ spec=h.spec; }
    else {
      w=pool[i];
      spec=genEnSpec(w);
      const speakInfo = spec.speak ? {t:w.en,l:'en-US',r:0.6} : null;
      h={answered:false, spec:{head:spec.head,hint:spec.hint,choices:spec.choices,answer:spec.answer,speakInfo,speak:speakFrom(speakInfo)}, wrongChoices:[]};
      history[i]=h;
    }
    choiceQ(body, {hint:spec.hint, head:spec.head, choices:spec.choices, answer:spec.answer, stat,
      capture:(label, isCorrect)=>{
        h.userAns=label;
        if(!isCorrect){
          h.wrongChoices=h.wrongChoices||[];
          if(!h.wrongChoices.includes(label)) h.wrongChoices.push(label);
        }
      },
      onDone:(ok, displayedOk)=>{
        h.answered=true; h.ok=(displayedOk!==undefined?displayedOk:ok);
        answeredCount=Math.max(answeredCount, i+1);
        persist();
        viewQuestion(answeredCount);
      },
      speak:spec.speak});
    renderNav();
    if(!resumeMuted && spec.speak) setTimeout(()=>{ try{ spec.speak(); }catch(e){} }, 350);
  }
  function persist(){
    const items=[];
    for(let i=0;i<stat.total;i++){
      const it=history[i];
      if(!it){ items.push(null); continue; }
      items.push({answered:it.answered, ok:it.ok, userAns:it.userAns, wrongChoices:(it.wrongChoices&&it.wrongChoices.length)?it.wrongChoices:undefined,
        spec: it.spec ? {head:it.spec.head,hint:it.spec.hint,choices:it.spec.choices,answer:it.spec.answer,speakInfo:it.spec.speakInfo||null} : undefined});
    }
    if(!S.challengeProgress) S.challengeProgress={};
    S.challengeProgress.en={ date:today(), fp:challengeFp('en'), kind:'en', total:stat.total, answeredCount, cur:answeredCount, stat:{idx:stat.idx,total:stat.total,right:stat.right,wrong:stat.wrong}, pool, items };
    save();
  }
  const controller={
    resumeSpeak:()=>{
      resumeMuted=false;
      const h=history[cur];
      if(h && h.spec && h.spec.speak) try{ h.spec.speak(); }catch(e){}
    }
  };
  viewQuestion(cur);
  return controller;
}

function openReview(kind){
  playTone('page');
  if(!S.challengeCfg) S.challengeCfg={};
  if(kind==='hanzi'){
    if(!(S.challengeCfg.hanzi && S.challengeCfg.hanzi.books && S.challengeCfg.hanzi.books.length)){ toast('请家长先到「家长中心 → 闯关配置」选择册'); return; }
    const r=getResume('hanzi');
    const ctl=startHanziChallenge(r); openPage('pgHanzi');   // r=null→全新；r=记录→直接定位到上次退出那道题
    if(r) askResume('hanzi', r, ctl);
  } else if(kind==='math'){
    if(!(S.challengeCfg.math && S.challengeCfg.math.types && S.challengeCfg.math.types.length)){ toast('请家长先到「家长中心 → 闯关配置」选择题型'); return; }
    const r=getResume('math');
    const ctl=startMathChallenge(r); openPage('pgMath');
    if(r) askResume('math', r, ctl);
  } else if(kind==='en'){
    if(!(S.challengeCfg.en && S.challengeCfg.en.books && S.challengeCfg.en.books.length && enEnabledWords().length)){ toast('请家长先到「家长中心 → 闯关配置」启用单词书'); return; }

    if(r) askResume('en', r, ctl);
  }
}

// ---------- 语文复习 ----------
function dueHanzi(){
  const t=today(); const out=[];
  for(const cid in S.hanziSchedule){ const it=S.hanziSchedule[cid]; if(it.due<=t && CHMAP[cid]) out.push(CHMAP[cid]); }
  return out;
}
function learnedHanzi(){ const out=[]; for(const cid in S.hanziSchedule){ if(CHMAP[cid]) out.push(CHMAP[cid]); } return out; }
// ---------- 通用 SRS 推进 ----------
function advanceSchedule(sched, key){
  const it=sched[key]; if(!it) return;
  it.level=Math.min(it.level+1, INTERVALS.length-1);
  it.due=addDays(INTERVALS[it.level]);
}
// ---------- 英语单词 SRS ----------
function dueEn(){
  const t=today(); const out=[];
  for(const en in S.enSchedule){ const it=S.enSchedule[en]; if(it.due<=t){ const w=ENWORDS.find(x=>x.en===en); if(w) out.push(w); } }
  return out;
}
function learnedEn(){ const out=[]; for(const en in S.enSchedule){ const w=ENWORDS.find(x=>x.en===en); if(w) out.push(w); } return out; }
// ---------- 数学复习 SRS ----------
function dueMath(){
  const t=today(); const out=[];
  for(const uid in S.mathSchedule){ const it=S.mathSchedule[uid]; if(it.due<=t) out.push(uid); }
  return out;
}
function drawMathUid(){
  const due=dueMath();
  if(due.length) return due[Math.floor(Math.random()*due.length)];
  const all=Object.keys(S.mathSchedule); if(!all.length) return null;
  return all[Math.floor(Math.random()*all.length)];
}
// ---------- 语文错题本（艾宾浩斯，独立于学习调度） ----------
function dueWrongHanzi(){
  const t=today(); const out=[];
  if(S.wrongHanzi && typeof S.wrongHanzi==='object' && !Array.isArray(S.wrongHanzi)){
    for(const cid in S.wrongHanzi){ const it=S.wrongHanzi[cid]; if(it && it.due<=t && CHMAP[cid]) out.push(cid); }
  }
  return out;
}
function updateWrongHanzi(cid, ok, isWrong){
  if(!cid || !CHMAP[cid]) return;
  if(!S.wrongHanzi || Array.isArray(S.wrongHanzi)) S.wrongHanzi={};
  if(!ok){
    S.wrongHanzi[cid]={level:0, due:addDays(INTERVALS[0])}; // 答错 → 重置回第 0 级，明天复习
  } else if(isWrong && S.wrongHanzi[cid]){
    const it=S.wrongHanzi[cid];
    it.level=Math.min(it.level+1, INTERVALS.length-1);
    it.due=addDays(INTERVALS[it.level]);
    if(it.level>=INTERVALS.length-1) delete S.wrongHanzi[cid]; // 升到最高级 → 移出错题本
  }
  save();
}

      const rest = w.slice(1); const isV = verbSet.includes(rest[0]);
      sent = isV ? ('我＿'+rest+'了。') : ('这是＿'+rest+'。');
    }
    head='<div class="qsent">'+esc(sent.replace(ch.c,'＿'))+'</div>';
    hint='✏️ 句子里少了哪个字？选出来';
    const dist=shuffle(others.map(x=>x.c)).filter(c=>{
      if(!c||c===ch.c) return false;
      if(sent.indexOf(ch.c)>=0) return !ALL_SENTS_SET.has(sent.replace(ch.c,c)); // 真实句：另一字带入也成句→排除
      return !(rest && ALL_WORDS_SET.has(c+rest));                                // 模板句：c+后缀成词→排除
    }).slice(0,3);
    choices=shuffle([ch.c].concat(dist)); answer=ch.c;
  } else if(type==='wordfill'){        // 词组填空
    const w=words.find(x=>x.indexOf(ch.c)===0)||words[0];
    const blank=w.replace(ch.c,'＿');
    head='<div class="qchar" style="font-size:38px">'+esc(blank)+'</div>';
    hint='✏️ 把词补充完整';
    const rest = w.replace(ch.c,'');
    const dist=shuffle(others.map(x=>x.c)).filter(c=>{
      if(!c||c===ch.c) return false;
      if(rest && (MERGED_WORDS_SET.has(c+rest)||MERGED_WORDS_SET.has(rest+c))) return false;
      return true;
    }).slice(0,3);
    choices=shuffle([ch.c].concat(dist)); answer=ch.c;
  } else if(type==='wordpick'){        // 选词题：选出能组词的字
    const w=words.find(x=>x.indexOf(ch.c)===0)||words[0];
    const pos=w.indexOf(ch.c); const partner=w.slice(0,pos)+w.slice(pos+1);
    head='<div class="qchar" style="font-size:40px">'+esc(ch.c)+'</div>';
    hint='🧩 选出能和这个字组成词的字';
    const bad=(c)=> (ch.c+c===w)||(c+ch.c===w);
    const dist=shuffle(others.map(x=>x.c)).filter(c=>{
      if(!c||c===ch.c||bad(c)) return false;
      return !(MERGED_WORDS_SET.has(ch.c+c)||MERGED_WORDS_SET.has(c+ch.c));
    }).slice(0,3);
    choices=shuffle([partner].concat(dist)); answer=partner;
  } else {                             // 看词选拼音（兜底，原 fillsent 已弃用）
    const w=words[0]; const py=wp[0];
    head='<div class="qchar" style="font-size:34px">'+esc(w)+'</div>';
    hint='🔤 看这个词，选出它的拼音';
    const dist=shuffle(others.map(x=>(x.wp&&x.wp[0])||x.py)).filter(p=>p&&p!==py).slice(0,3);
    choices=shuffle([py].concat(dist)); answer=py;
  }

  return {head,hint,choices,answer,speak:speakFn};
}

function buildOpts(opts, answer, onCorrect, acceptList, onWrong){
  const wrap=document.createElement('div'); wrap.className='opts';
  opts.forEach(o=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{

    };

function genMath(){
  const r=Math.random();
  if(r<0.45){ // 加法
    let a=Math.floor(Math.random()*100), b=Math.floor(Math.random()*100); return {q:a+'+'+b, ans:a+b};
  } else if(r<0.9){ // 减法
    let a=Math.floor(Math.random()*100), b=Math.floor(Math.random()*(a+1)); return {q:a+'-'+b, ans:a-b};
  } else { // 乘法
    let a=Math.floor(Math.random()*9)+1, b=Math.floor(Math.random()*9)+1; return {q:a+'×'+b, ans:a*b};
  }
}
let mathRight=0, mathWrong=0, mathCur=null, mathInput='', mathIndex=0, mathTotal=10, mathStrike=0;
function startMath(){ mathRight=0; mathWrong=0; mathInput=''; mathIndex=0; mathStrike=0; nextMath(); }
function nextMath(){
  mathIndex++;
  if(mathIndex>mathTotal){ markQuizDone('math'); showGameEnd('数学复习', mathRight, mathWrong, 'math', ()=>startMath(), mathStrike); return; }
  const muid=drawMathUid();
  if(!muid){ markQuizDone('math'); showGameEnd('数学复习', mathRight, mathWrong, 'math', ()=>startMath(), mathStrike); return; }
  mathCur=S.mathSchedule[muid]; mathCur.uid=muid; mathCur.tries=0; mathInput='';
  $('mathStat').textContent='第 '+mathIndex+' / '+mathTotal+'　对 '+mathRight+'　错 '+mathWrong;
  $('mathBody').innerHTML='';
  $('mathBody').appendChild(hintBubble(HINT.math));
  const eq=document.createElement('div'); eq.className='eq'; eq.innerHTML=esc(mathCur.q)+' = <span class="ans">'+mathInput+'</span>';
  $('mathBody').appendChild(eq);
  const kp=document.createElement('div'); kp.className='keypad';
  const keys=['1','2','3','4','5','6','7','8','9','清除','0','✓'];
  keys.forEach(k=>{
    const b=document.createElement('button'); b.textContent=k;
    if(k==='✓') b.className='ok'; if(k==='清除') b.className='cl';
    b.onclick=()=>{
      if(k==='清除'){ mathInput=''; }
      else if(k==='✓'){ checkMath(); return; }
      else { if(mathInput.length<4) mathInput+=k; }
      eq.querySelector('.ans').textContent=mathInput||'';
    };
    kp.appendChild(b);
  });
  $('mathBody').appendChild(kp);
}
function checkMath(){
  if(mathInput==='') return;
  const correct = parseInt(mathInput,10)===mathCur.ans;
  if(correct){
    mathRight++;
    if(mathCur && mathCur.uid) advanceSchedule(S.mathSchedule, mathCur.uid);
    $('mathStat').textContent='第 '+mathIndex+' / '+mathTotal+'　对 '+mathRight+'　错 '+mathWrong;
    showFeedback(true, ()=>nextMath());
  } else {
    mathWrong++;
    mathCur.tries=(mathCur.tries||0)+1;
    if(mathCur.tries>=3){
      mathStrike++;
      $('mathStat').textContent='第 '+mathIndex+' / '+mathTotal+'　对 '+mathRight+'　错 '+mathWrong;
      showFeedback(false, ()=>nextMath(), '正确答案 '+mathCur.ans);
    } else {
      mathInput='';
      const eq=$('mathBody').querySelector('.eq'); if(eq) eq.querySelector('.ans').textContent='';
      showFeedback(false, null, '还有 '+(3-mathCur.tries)+' 次机会');
    }
  }
}

let phonicsBookOpen=null;
function renderPhonics(){
  const body=$('phonicsBody'); body.innerHTML='';
  const books = D.phonicsBooks || [];
  if(!books.length){ body.innerHTML='<div class="empty">暂无自然拼读课程数据</div>'; return; }

  // 统计进度
  function phonicsDone(book, n){
    return !!S.phonicsDone && S.phonicsDone['b'+book+'u'+n];
  }
  function totalDone(){
    let t=0;
    books.forEach((bk,bi)=> bk.forEach(u=> { if(phonicsDone(bi+1,u.n)) t++; }));
    return t;
  }
  let nextBook=1, nextUnit=1;
  outer: for(let bi=0; bi<books.length; bi++){
    for(const u of books[bi]){
      if(!phonicsDone(bi+1, u.n)){ nextBook=bi+1; nextUnit=u.n; break outer; }
    }
    if(bi===books.length-1) { nextBook=-1; } // all done
  }

  let h='<p style="font-size:13px;color:var(--sub);margin:2px 0 12px">自动推荐下一课（橙色边框）。学完点“学习完成”即记录进度。</p>';

  if(phonicsBookOpen===null){ phonicsBookOpen = nextBook>0 ? nextBook : 1; }

  const titles = {1:'The Alphabet 字母',2:'Short Vowels 短元音',3:'Long Vowels 长元音',4:'Consonant Blends 辅音组合',5:'Letter Combinations 字母组合'};

  books.forEach((bk, bi)=>{
    const bnum = bi + 1;
    const doneInBook = bk.filter(u => phonicsDone(bnum, u.n)).length;
    const open = phonicsBookOpen === bnum;
    const allDone = doneInBook === bk.length;
    h += `<div class="bookhead${open?' open':''}" data-book="${bnum}"><span class="bt">自然拼读 第${bnum}册 · ${titles[bnum]||''}</span><span class="bp">${allDone?'✓ 已学完':(doneInBook+' / '+bk.length+' Unit')}</span><span class="bc">${open?'▾':'▸'}</span></div>`;
    if(!open) return;
    bk.forEach(u => {
      const uid='b'+bnum+'u'+u.n;
      const done=phonicsDone(bnum,u.n);
      const rec=(!done && bnum===nextBook && u.n===nextUnit)?' rec':'';
      if(done){
        h+=`<div class="lesson${rec}"><div class="row1"><span class="ln">Unit ${u.n}</span><div class="lt">${esc(u.title)}</div><span class="st">✓ 已学</span></div></div>`;
      } else {
        h+=`<div class="lesson${rec}"><div class="row1"><span class="ln">Unit ${u.n}</span><div class="lt">${esc(u.title)}</div><button class="go" data-unit="${uid}">学习</button></div></div>`;
      }
    });
  });

  body.innerHTML = h;

  // 册头点击：手风琴展开/收起（一次一册）
  body.querySelectorAll('[data-book]').forEach(hd => {
    hd.onclick = () => {
      const bk=parseInt(hd.dataset.book,10);
      phonicsBookOpen = (phonicsBookOpen===bk) ? -1 : bk;
      renderPhonics();
    };
  });

  // 学习按钮 → 进入学习中页
  body.querySelectorAll('[data-unit]').forEach(btn => {
    if(btn.tagName==='BUTTON'){
      btn.onclick = () => beginPhonicsLesson(btn.dataset.unit);
    }
  });
}

  let i=0, right=0, wrong=0;

    body.innerHTML='';

    setTimeout(()=>speak(f.syl,'en-US',0.55), 350);
    let qWrong=0;
    const opts=pickOpts(f.syl, fams.map(x=>x.syl));
    body.appendChild(buildOpts(opts, f.syl, ()=>{
      right++;

}

// 已学自然拼读课程里的音节（按 Syllable family 取），用于音节练习出题
function learnedSyllables(){
  const out=new Set();
  const books=D.phonicsBooks||[];
  if(!S.phonicsDone) return [];
  const famSet=new Set(); D.phonics.forEach(v=> v.families.forEach(f=> famSet.add(f.syl)));
  for(const uid in S.phonicsDone){
    const m=uid.match(/^b(\d+)u(\d+)$/); if(!m) continue;
    const bi=parseInt(m[1],10)-1, un=parseInt(m[2],10);
    const bk=books[bi]; if(!bk) continue;
    const u=bk.find(x=>x.n===un); if(!u||!u.sounds) continue;
    u.sounds.forEach(s=>{ if(famSet.has(s)) out.add(s); });
  }
  return [...out];
}

let calY=null, calM=null, calSel=null;
function ds(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function dayStat(dstr){
  const L=S.tasks.learning||[], H=S.tasks.lifeHabits||[], SP=S.tasks.lifeSports||[];
  const hit=arr=> arr.filter(t=> (S.doneDates[t.id]||[]).includes(dstr));
  const dl=hit(L), dh=hit(H), dsp=hit(SP);
  const cnt=dl.length+dh.length+dsp.length;
  const total=L.length+H.length+SP.length;
  const log=(S.pointLog||{})[dstr];
  // 老数据没有流水时，按“每项1分”估算
  const earn = log ? log.earn : cnt;
  const spend = log ? log.spend : 0;
  const lessons = Object.keys(S.lessonsDone||{}).filter(k=> S.lessonsDone[k]===dstr);
  return {dl,dh,dsp,cnt,total,earn,spend,items:(log&&log.items)||[],est:!log&&cnt>0,lessons};
}
function barColor(r){ if(r>=0.8) return 'var(--green)'; if(r>=0.5) return 'var(--blue)'; if(r>0) return 'var(--yellow)'; return 'transparent'; }
function renderCalendar(){
  const now=new Date();
  if(calY===null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const t=today();
  const first=new Date(calY,calM,1);
  const startWd=first.getDay(); // 0=周日

  // 月度汇总

    const k=ds(calY,calM,d);

    const st=dayStat(k);
    mEarn+=st.earn; mSpend+=st.spend; mLesson+=st.lessons.length;
    if(st.cnt>0){ mDays++; }
    mRate+=st.total? st.cnt/st.total : 0; rated++;

  const avg = rated? Math.round(mRate/rated*100) : 0;
  $('calTotal').textContent='⭐ '+S.points;

  h+='<div class="cal-sum">';
  h+='<div class="b"><b style="color:var(--orange)">'+mEarn+'</b><span>本月得分 ⭐</span></div>';
  h+='<div class="b"><b>'+mDays+'</b><span>打卡天数</span></div>';
  h+='<div class="b"><b style="color:var(--green)">'+avg+'%</b><span>平均完成率</span></div>';
  h+='<div class="b"><b style="color:#8E7BE8">'+mLesson+'</b><span>识字课数</span></div>';
  h+='</div>';
  // 网格
  h+='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(w=> h+='<div class="cal-wd">'+w+'</div>');
  for(let i=0;i<startWd;i++) h+='<div class="cal-cell blank"></div>';
  for(let d=1; d<=days; d++){
    const k=ds(calY,calM,d);
    const st=dayStat(k);
    const rate=st.total? st.cnt/st.total : 0;
    const future = k>t;
    const cls='cal-cell'+(k===t?' today':'')+(k===calSel?' sel':'')+(st.cnt===0?' none':'');
    h+='<div class="'+cls+'" data-day="'+k+'">';
    h+='<div class="dn">'+d+'</div>';

    h+='<div class="bar"><i style="width:'+Math.round(rate*100)+'%;background:'+barColor(rate)+'"></i></div>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="cal-legend">完成度：<em style="background:var(--yellow)"></em>少 <em style="background:var(--blue)"></em>中 <em style="background:var(--green)"></em>多　·　点日期看当天明细</div>';
  // 最近7天趋势
  h+='<div class="cal-detail"><h4>📈 最近 7 天得分</h4><div class="trend">';
  const seven=[]; let maxv=1;
  for(let i=6;i>=0;i--){
    const dt=new Date(); dt.setHours(0,0,0,0); dt.setTime(dt.getTime()-i*DAY);

function buildDayDetailHTML(k){
  if(!k) return '';
  const st=dayStat(k);
  const [y,m,d]=k.split('-').map(Number);
  const wd=['周日','周一','周二','周三','周四','周五','周六'][new Date(y,m-1,d).getDay()];
  // 顶部只展示今日得分，不展示兑换/净分
  const dayNet=(st.earn||0)-(st.spend||0);
  let h='<div class="cal-detail"><h4><span>'+m+'月'+d+'日 '+wd+'</span><span style="color:var(--orange);font-size:15px">⭐ '+(dayNet>=0?'+':'')+dayNet+'</span></h4>';
  const BOARD={hanzi:'语文复习', math:'数学复习', en:'英语复习'};
  const isReward=(x)=> isBonusReason(x.r) || (x.r||'').indexOf('家长加分')===0 || (x.r||'').indexOf('家长扣分')===0 || (x.r||'').indexOf('补录·额外加分')===0;
  const learnNames=(S.tasks.learning||[]).map(t=>t.name);
  const habitNames=[].concat(S.tasks.lifeHabits||[],S.tasks.lifeSports||[]).map(t=>t.name);
  function catOf(x){
    const r=x.r||'';
    if(isReward(x)) return 'reward';
    if(r.indexOf('复习闯关·')===0 || r.indexOf('闯关·')===0) return 'review';
    for(const nm of learnNames){ if(r===nm || r.indexOf(nm+' ')===0) return 'learn'; }
    for(const nm of habitNames){ if(r===nm) return 'habit'; }
    return 'learn';
  }
  function dispName(x){
    const r=x.r||'';
    const cat=catOf(x);
    if(cat==='review'){ const b=r.replace('复习闯关·','').replace('闯关·',''); return '复习闯关·'+(BOARD[b]||b); }
    if(cat==='learn'){ for(const nm of learnNames){ if(r===nm) return nm; if(r.indexOf(nm+' ')===0) return nm; } return r; }
    return r;
  }
  // 按展示名汇总正分
  const sum={};
  st.items.filter(x=> x.n>0).forEach(x=>{ const kk=dispName(x); sum[kk]=(sum[kk]||0)+x.n; });
  const done=(id)=> (S.doneDates[id]||[]).includes(k);
  function board(title, rows){
    if(!rows.length) return '';
    return '<div class="bonusrow"><b>'+title+'</b></div>'+rows.join('');
  }
  // 任务行：仅显示已完成项；未完成的不展示
  function taskRow(name, isDone, n){
    if(!isDone || n<=0) return '';
    return '<div class="bonusrow">'+esc(name)+'　<span style="color:var(--good);font-weight:700">✅ 完成</span>　<b style="color:var(--orange)">+'+n+' ⭐</b></div>';
  }
  // 📚 学习任务
  const learnRows=[];
  (S.tasks.learning||[]).forEach(t=>{
    const isD=done(t.id);
    const n=isD?(sum[t.name]||0):0;
    const row=taskRow((t.ic?t.ic+' ':'')+t.name, isD, n);
    if(row) learnRows.push(row);
  });
  // 🎯 复习闯关
  const reviewRows=[];
  const quizSet=[...new Set(st.items.filter(x=>{ const r=x.r||''; return r.indexOf('复习闯关·')===0 || r.indexOf('闯关·')===0; }).map(x=> (x.r||'').replace('复习闯关·','').replace('闯关·','')))];
  quizSet.forEach(b=>{ const nm='复习闯关·'+(BOARD[b]||b); reviewRows.push(taskRow(nm, true, sum[nm]||0)); });
  // 🌈 生活好习惯
  const habitRows=[];
  [].concat(S.tasks.lifeHabits||[],S.tasks.lifeSports||[]).forEach(t=>{
    const isD=done(t.id);
    const n=isD?(sum[t.name]||0):0;
    const row=taskRow((t.ic?t.ic+' ':'')+t.name, isD, n);
    if(row) habitRows.push(row);
  });
  // 🎁 家长奖励 / 额外加分（无完成状态，仅展示名称 + 加分）
  const rewardRows=[];
  st.items.filter(x=> isReward(x)).forEach(x=>{ const neg=x.n<0; const col=neg?'#FF6B6B':'#3FA7FF'; const sgn=neg?'−':'+'; rewardRows.push('<div class="bonusrow">'+esc(x.r||'')+'　<b style="color:'+col+'">'+sgn+Math.abs(x.n)+' ⭐</b></div>'); });
  const anyBlock = learnRows.length || reviewRows.length || habitRows.length || rewardRows.length;
  if(!anyBlock){
    h+='<div class="empty" style="padding:14px 0">这天还没有记录哦 🦕</div>';
  } else {
    h+=board('📚 学习任务', learnRows);
    h+=board('🎯 复习闯关', reviewRows);
    h+=board('🌈 生活好习惯', habitRows);
    h+=board('🎁 家长奖励 / 额外加分', rewardRows);
  }
  h+='</div>';
  return h;
}
function isRewardItem(x){ return isBonusReason(x.r) || (x.r||'').indexOf('家长加分')===0 || (x.r||'').indexOf('家长扣分')===0 || (x.r||'').indexOf('补录·额外加分')===0; }
let calEditItems=null, calEditDel=[];
function openCalEdit(k){
  if(!k) return;
  const enter=()=>{
    calEditItems = ((S.pointLog&&S.pointLog[k]&&S.pointLog[k].items)||[]).map(x=>({n:x.n,r:x.r}));
    calEditDel=[];
    renderCalEdit(k);
  };
  if(S.pin){ askPin(ok=>{ if(ok) enter(); else toast('PIN 错误'); }); }
  else { enter(); }
}
function renderCalEdit(k){
  const items=calEditItems||[];
  let rows='';
  items.forEach((it,idx)=>{
    const reward=isRewardItem(it);
    const isSub=(it.r||'').indexOf('家长扣分')===0;
    const valHtml = reward
      ? '<input class="ce-in" type="number" min="'+(isSub?-99:1)+'" max="'+(isSub?-1:1000)+'" value="'+it.n+'" data-i="'+idx+'" data-sub="'+(isSub?1:0)+'">'
      : '<span class="ce-val">+'+it.n+' ⭐</span><span class="ce-lock" title="任务分只能删除，不能改值">🔒</span>';
    rows += '<div class="ce-row '+(reward?'reward':'task')+'">'
      + '<span class="ce-r">'+esc(it.r)+'</span>'
      + '<span class="ce-n">'+valHtml+'</span>'
      + '<button class="ce-del" data-del="'+idx+'">🗑</button>'
      + '</div>';
  });
  const html =
    '<button class="popx" data-close>✕</button>'+
    '<div class="cal-edit">'+
      '<div style="font-weight:800;margin-bottom:8px;text-align:left">✏️ 编辑 '+k+' 得分</div>'+
      (rows || '<div class="empty" style="padding:14px 0">这天没有积分记录</div>')+
      '<div class="ce-tip">🔒 任务分只能删除，不能改值　·　🎁 家长加分可改值</div>'+
      '<div class="opts"><button data-cancel>取消</button><button class="ce-save" data-ok>保存</button></div>'+
    '</div>';
  popBox(html, ()=>{ saveCalEdit(k); return false; });
  const box=$('popBox'); box.classList.add('bk');
  const xb=box.querySelector('[data-close]'); if(xb) xb.onclick=closePop;
  box.querySelectorAll('.ce-in').forEach(inp=> inp.oninput=()=>{ const i=+inp.dataset.i; if(inp.dataset.sub==='1'){ calEditItems[i].n=Math.min(-1,Math.max(-99,Number(inp.value)||0)); } else { calEditItems[i].n=Math.max(1,Math.min(99,Number(inp.value)||0)); } });
  box.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.del; const it=calEditItems[i]; if(it && !isRewardItem(it)) calEditDel.push(it.r); calEditItems.splice(i,1); renderCalEdit(k); });
  const c=box.querySelector('[data-cancel]'); if(c) c.onclick=()=> openCalDayDetail(k);
}
function saveCalEdit(k){
  calEditDel.forEach(r=> unmarkTaskDay(k, r));
  const items=(calEditItems||[]).map(x=>({n:Number(x.n)||0, r:x.r}));
  if(!S.pointLog) S.pointLog={};
  if(items.length){
    let earn=0, spend=0;
    items.forEach(x=>{ if(x.n>=0) earn+=x.n; else spend+=(-x.n); });
    S.pointLog[k]={earn:earn, spend:spend, items:items};
  } else { delete S.pointLog[k]; }
  S.points = Math.max(0, totalEarned() - totalRedeemed());
  syncSidebar(); save();
  openCalDayDetail(k);
}
function unmarkTaskDay(k, r){
  (S.tasks.learning||[]).forEach(t=>{ if(r===t.name || r.indexOf(t.name+' ')===0) rmDone(t.id,k); });
  [].concat(S.tasks.lifeHabits||[],S.tasks.lifeSports||[]).forEach(t=>{ if(r===t.name) rmDone(t.id,k); });
}
function rmDone(id,k){ const a=S.doneDates[id]; if(a){ const i=a.indexOf(k); if(i>=0) a.splice(i,1); } }

function renderDayDetail(k){
  if(!k) return;
  $('calDetail').innerHTML = buildDayDetailHTML(k);
}
function lessonTitle(id){
  let out=id;
  D.hanzi.forEach(b=> b.lessons.forEach(l=>{ if(('b'+b.book+'l'+l.n)===id) out='第'+b.book+'册第'+l.n+'课 '+l.title; }));
  return out;
}

function renderRewards(){

    +'<div class="ptscell"><span class="ico">🎁</span><div class="ptxt"><div class="pv">'+redeemed+'</div><div class="pl">已兑换积分</div></div></div>'
    +'<div class="ptscell"><span class="ico">💰</span><div class="ptxt"><div class="pv">'+balance+'</div><div class="pl">剩余积分</div></div></div>'

    +'<span class="hg-ar">›</span>'
    +'</div>';
  // 兑换按钮（带心愿计数）
  h+='<button class="bigbtn exch-btn" onclick="openExchange()" style="background:linear-gradient(135deg,var(--orange),#FFB347);color:#fff;margin-top:12px">🎁 兑换玩具 / 奖励'+(wishN?'（心愿 '+wishN+'）':'')+'</button>';
  // 玩具 & 心愿（已兑换 + 待兑换 混排，按时间排序；待兑换虚线灰调角标）
  const doneN=S.rewardLog.length, pendN=wishN;
  h+='<div style="font-size:14px;font-weight:800;margin:16px 0 8px">🎁 我的玩具柜（已兑换 '+doneN+' · 心愿 '+pendN+'）</div>';
  const all=[];

  (S.wishlist||[]).forEach((r,i)=> all.push({r:r,idx:i,kind:'wish'}));
  all.sort((a,b)=> (b.r.date||'').localeCompare(a.r.date||'')); // 按时间倒序（最新在前）
  if(all.length){
    h+='<div class="rwdgrid">';
    all.forEach(it=>{
      const r=it.r, idx=it.idx, isWish=(it.kind==='wish');
      const pts=rewardPts(r);
      const thumb=(r.img)
        ? '<img class="rwdthumb" src="'+r.img+'" onclick="openLightbox('+idx+',\''+(isWish?'wish':'done')+'\')">'
        : '<div class="rwdthumb emoji">🎁</div>';
      if(isWish){
        // 待兑换卡片：虚线灰调 + 角标 + 进度条 + 马上兑换
        const need=Math.max(0, pts - balance);
        const pct=Math.max(0, Math.min(100, Math.round(balance/pts*100)));
        const enough = balance>=pts;
        h+='<div class="rwdcard pending">'
          +'<div class="rwdbadge">🎯 待兑换</div>'
          +'<div class="rwdthumbwrap">'+thumb
          +'<button class="rwdedit" title="编辑" onclick="editWish('+idx+')">✏️</button>'
          +'<button class="rwddel" title="删除" onclick="delWish('+idx+')">🗑</button>'
          +'</div>'
          +'<div class="rwdname" title="'+esc(r.name||'')+'">'+esc(r.name||'玩具')+'</div>'
          +'<div class="rwdpts2">'+pts+' 分</div>'
          +'<div class="rwdprog"><i style="width:'+pct+'%"></i></div>'
          +'<div class="rwdduo">'+(enough ? '✅ 可以兑换啦！' : ('还差 '+need+' 分 💪'))+'</div>'
          +(enough ? '<button class="rwdconvbtn" onclick="convertWish('+idx+')">🎁 马上兑换</button>' : '')
          +'<div class="rwddate2">'+r.date+'</div>'
          +'</div>';
      } else {
        h+='<div class="rwdcard">'
          +'<div class="rwdthumbwrap">'+thumb
          +'<button class="rwdedit" title="编辑" onclick="editExchange('+idx+')">✏️</button>'
          +'<button class="rwddel" title="删除" onclick="delExchange('+idx+')">🗑</button>'
          +'</div>'
          +'<div class="rwdname" title="'+esc(r.name||'')+'">'+esc(r.name||'玩具')+'</div>'
          +'<div class="rwdpts2">'+pts+' 分</div>'
          +'<div class="rwddate2">'+r.date+'</div>'
          +'</div>';
      }
    });
    h+='</div>';

    h+='<div class="empty-tip">还没有兑换记录，点上面按钮去换玩具或加个心愿吧~</div>';

// 把备份（纯用户数据）合并回 S：完成记录按字段全部保留；任务结构以代码为准（名称/图标/顺序）
function applyBackup(d){
  const KEEP=['doneDates','pointLog','points','fund','rewardLog','pendingReward','medals',
    'hanziSchedule','enSchedule','mathSchedule','quizDone','quizTotal','quizCount','lessonsDone',
    'wrongHanzi','wrongEn','wrongPhonics','wrongMath','phonicsDone','mathDone','mathSRSeeded',
    'lastBackup','pointsAtBackup','seedVersion','rewardSeedDone','honorResetQuiz',
    'pin','mascot','mascotName'];
  KEEP.forEach(k=>{ if(k in d) S[k]=d[k]; });
  S.tasks = def().tasks; // 结构跟代码（新增任务一定出现）；完成记录(doneDates 等)已按任务 id 保留
  save();
  runMigrations(); // 套用新版初始化的所有升级 + 重新评估荣誉
  renderHome(); closePage(); toast('导入成功');
}
function backupMenu(){
  openPage('pgSettings'); $('setTitle').textContent='备份 / 导入';
  let h='';
  h+='<button class="pbtn" data-b="exp"><span class="ic">📤</span>导出备份文件（JSON）</button>';
  h+='<button class="pbtn" data-b="imp"><span class="ic">📥</span>导入备份文件</button>';
  h+='<p style="font-size:12px;color:var(--sub);margin-top:10px">数据保存在本机浏览器中。<br>换设备时：用上方「导出备份文件」带走，再到新设备「导入」即可迁移。<br>同一台电脑/浏览器更新本 HTML 后，数据会自动保留，无需重新导入。</p>';
  h+='<input type="file" id="impFile" accept="application/json" style="display:none">';
  $('settingsBody').innerHTML=h;
  $('settingsBody').querySelector('[data-b="exp"]').onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='ethan-learning-'+today()+'.json'; a.click(); S.lastBackup=today(); S.pointsAtBackup=S.points; save(); toast('已导出');
  };
  $('settingsBody').querySelector('[data-b="imp"]').onclick=()=> $('impFile').click();
  $('impFile').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d || typeof d!=='object' || !('doneDates' in d || 'points' in d)){ toast('备份文件格式不正确'); return; }
        popBox('<div style="text-align:center;padding:6px 2px">'
          +'<div style="font-size:30px;margin-bottom:6px">📥</div>'
          +'<div style="font-weight:800;margin-bottom:6px">导入将覆盖当前数据</div>'
          +'<div style="font-size:13px;color:var(--sub);margin-bottom:14px">确定要导入这份备份吗？<br>导入前会自动备份当前数据，可随时找回。</div>'
          +'<button class="primary" data-ok style="width:100%">确定导入</button>'
          +'<button id="impCancel" style="width:100%;margin-top:8px">取消</button>'
          +'</div>',
          ()=>{ autoBackupCurrent(); applyBackup(d); closePop(); });
        const cb=$('impCancel'); if(cb) cb.onclick=closePop;
      }catch(err){ toast('文件格式错误'); }
    };
    r.readAsText(f);
  };
}

      const mag=(cv>0)?cv:sel;

      const v=mag*(mode==='sub'?-1:1);
      const rt=($('reason').value||'').trim();
      const base=(mode==='sub')?'家长扣分':'家长加分·整体';
      const reason=base+(rt?'·'+rt:'');
      addPoints(v, reason); save(); renderHome();
      toast((v>0?'+':'−')+mag+' ⭐'); closePop(); return true;
    });

  const segBtns=box.querySelectorAll('[data-mode]');

  const applyMode=()=>{

    segBtns.forEach(x=>{ const on=x.dataset.mode===mode; const self=COL[x.dataset.mode]; x.style.background=on?self.solid:self.soft; x.style.color=on?'#fff':self.ink; x.style.borderColor=on?self.solid:self.border; x.style.borderWidth='1.5px'; });

  segBtns.forEach(b=> b.onclick=()=>{
    mode=b.dataset.mode;

    b.classList.add('sel');

    applyMode();
  });

    sel=parseInt(b.dataset.b,10);
    presetBtns.forEach(x=> x.classList.remove('sel'));
    b.classList.add('sel');
