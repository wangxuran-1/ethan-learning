// ---------- 日历 ----------
let calY=null, calM=null, calSel=null;
function ds(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function dayStat(dstr){
  const L=S.tasks.learning||[], H=S.tasks.lifeHabits||[], SP=S.tasks.lifeSports||[];
  const hit=arr=> arr.filter(t=> (S.doneDates[t.id]||[]).includes(dstr));
  const dl=hit(L), dh=hit(H), dsp=hit(SP);
  const cnt=dl.length+dh.length+dsp.length;
  const total=L.length+H.length+SP.length;
  const log=(S.pointLog||{})[dstr];
  // 老数据没有流水时，按“每项1分”估算
  const earn = log ? log.earn : cnt;
  const spend = log ? log.spend : 0;
  const lessons = Object.keys(S.lessonsDone||{}).filter(k=> S.lessonsDone[k]===dstr);
  return {dl,dh,dsp,cnt,total,earn,spend,items:(log&&log.items)||[],est:!log&&cnt>0,lessons};
}
function barColor(r){ if(r>=0.8) return 'var(--green)'; if(r>=0.5) return 'var(--blue)'; if(r>0) return 'var(--yellow)'; return 'transparent'; }
function renderCalendar(){
  const now=new Date();
  if(calY===null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const t=today();
  const first=new Date(calY,calM,1);
  const startWd=first.getDay(); // 0=周日
  const days=new Date(calY,calM+1,0).getDate();
  // 月度汇总
  let mEarn=0, mSpend=0, mDays=0, mRate=0, mLesson=0, rated=0;
  for(let d=1; d<=days; d++){
    const k=ds(calY,calM,d);
    if(k>t) continue;
    const st=dayStat(k);
    mEarn+=st.earn; mSpend+=st.spend; mLesson+=st.lessons.length;
    if(st.cnt>0){ mDays++; }
    mRate+=st.total? st.cnt/st.total : 0; rated++;
  }
  const avg = rated? Math.round(mRate/rated*100) : 0;
  $('calTotal').textContent='⭐ '+S.points;
  let h='';
  h+='<div class="cal-head"><button id="calPrev">‹</button><div class="mtitle">'+calY+' 年 '+(calM+1)+' 月</div><button id="calNext">›</button></div>';
  h+='<div style="text-align:right;margin:4px 2px 0"><button class="mini" id="bkBtn">📝 积分补录</button></div>';
  h+='<div class="cal-sum">';
  h+='<div class="b"><b style="color:var(--orange)">'+mEarn+'</b><span>本月得分 ⭐</span></div>';
  h+='<div class="b"><b>'+mDays+'</b><span>打卡天数</span></div>';
  h+='<div class="b"><b style="color:var(--green)">'+avg+'%</b><span>平均完成率</span></div>';
  h+='<div class="b"><b style="color:#8E7BE8">'+mLesson+'</b><span>识字课数</span></div>';
  h+='</div>';
  // 网格
  h+='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(w=> h+='<div class="cal-wd">'+w+'</div>');
  for(let i=0;i<startWd;i++) h+='<div class="cal-cell blank"></div>';
  for(let d=1; d<=days; d++){
    const k=ds(calY,calM,d);
    const st=dayStat(k);
    const rate=st.total? st.cnt/st.total : 0;
    const future = k>t;
    const cls='cal-cell'+(k===t?' today':'')+(k===calSel?' sel':'')+(st.cnt===0?' none':'');
    h+='<div class="'+cls+'" data-day="'+k+'">';
    h+='<div class="dn">'+d+'</div>';
    h+='<div class="pt'+(st.earn?'':' zero')+'">'+(future?'':(st.earn? '⭐'+st.earn : '·'))+'</div>';
    h+='<div class="bar"><i style="width:'+Math.round(rate*100)+'%;background:'+barColor(rate)+'"></i></div>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="cal-legend">完成度：<em style="background:var(--yellow)"></em>少 <em style="background:var(--blue)"></em>中 <em style="background:var(--green)"></em>多　·　点日期看当天明细</div>';
  // 最近7天趋势
  h+='<div class="cal-detail"><h4>📈 最近 7 天得分</h4><div class="trend">';
  const seven=[]; let maxv=1;
  for(let i=6;i>=0;i--){
    const dt=new Date(); dt.setHours(0,0,0,0); dt.setTime(dt.getTime()-i*DAY);
    const k=ds(dt.getFullYear(),dt.getMonth(),dt.getDate());
    const v=dayStat(k).earn; maxv=Math.max(maxv,v);
    seven.push({k:k, d:dt.getDate(), v:v});
  }
  seven.forEach(x=>{
    h+='<div class="tb"><u>'+(x.v||'')+'</u><i style="height:'+Math.max(3,Math.round(x.v/maxv*58))+'px"></i><span>'+x.d+'日</span></div>';
  });
  h+='</div></div>';
  // 当日明细
  h+='<div id="calDetail"></div>';
  $('calBody').innerHTML=h;
  $('calPrev').onclick=()=>{ calM--; if(calM<0){ calM=11; calY--; } renderCalendar(); };
  $('calNext').onclick=()=>{ calM++; if(calM>11){ calM=0; calY++; } renderCalendar(); };
  $('bkBtn').onclick=openBackfill;
  $('calBody').querySelectorAll('[data-day]').forEach(c=> c.onclick=()=>{ calSel=c.dataset.day; renderCalendar(); });
  renderDayDetail(calSel || t);
}
function buildDayDetailHTML(k){
  if(!k) return '';
  const st=dayStat(k);
  const [y,m,d]=k.split('-').map(Number);
  const wd=['周日','周一','周二','周三','周四','周五','周六'][new Date(y,m-1,d).getDay()];
  // 顶部只展示今日得分，不展示兑换/净分
  let h='<div class="cal-detail"><h4><span>'+m+'月'+d+'日 '+wd+'</span><span style="color:var(--orange);font-size:15px">⭐ +'+st.earn+'</span></h4>';
  const BOARD={hanzi:'语文复习', math:'数学复习', en:'英语复习'};
  const isReward=(x)=> isBonusReason(x.r) || (x.r||'').indexOf('家长加分')===0 || (x.r||'').indexOf('补录·额外加分')===0;
  const learnNames=(S.tasks.learning||[]).map(t=>t.name);
  const habitNames=[].concat(S.tasks.lifeHabits||[],S.tasks.lifeSports||[]).map(t=>t.name);
  function catOf(x){
    const r=x.r||'';
    if(isReward(x)) return 'reward';
    if(r.indexOf('复习闯关·')===0 || r.indexOf('闯关·')===0) return 'review';
    for(const nm of learnNames){ if(r===nm || r.indexOf(nm+' ')===0) return 'learn'; }
    for(const nm of habitNames){ if(r===nm) return 'habit'; }
    return 'learn';
  }
  function dispName(x){
    const r=x.r||'';
    const cat=catOf(x);
    if(cat==='review'){ const b=r.replace('复习闯关·','').replace('闯关·',''); return '复习闯关·'+(BOARD[b]||b); }
    if(cat==='learn'){ for(const nm of learnNames){ if(r===nm) return nm; if(r.indexOf(nm+' ')===0) return nm; } return r; }
    return r;
  }
  // 按展示名汇总正分
  const sum={};
  st.items.filter(x=> x.n>0).forEach(x=>{ const kk=dispName(x); sum[kk]=(sum[kk]||0)+x.n; });
  const done=(id)=> (S.doneDates[id]||[]).includes(k);
  function board(title, rows){
    if(!rows.length) return '';
    return '<div class="bonusrow"><b>'+title+'</b></div>'+rows.join('');
  }
  // 任务行：仅显示已完成项；未完成的不展示
  function taskRow(name, isDone, n){
    if(!isDone || n<=0) return '';
    return '<div class="bonusrow">'+esc(name)+'　<span style="color:var(--good);font-weight:700">✅ 完成</span>　<b style="color:var(--orange)">+'+n+' ⭐</b></div>';
  }
  // 📚 学习任务
  const learnRows=[];
  (S.tasks.learning||[]).forEach(t=>{
    const isD=done(t.id);
    const n=isD?(sum[t.name]||0):0;
    const row=taskRow((t.ic?t.ic+' ':'')+t.name, isD, n);
    if(row) learnRows.push(row);
  });
  // 🎯 复习闯关
  const reviewRows=[];
  const quizSet=[...new Set(st.items.filter(x=>(x.r||'').indexOf('复习闯关·')===0).map(x=> x.r.replace('复习闯关·','')))];
  quizSet.forEach(b=>{ const nm='复习闯关·'+(BOARD[b]||b); reviewRows.push(taskRow(nm, true, sum[nm]||0)); });
  // 🌈 生活好习惯
  const habitRows=[];
  [].concat(S.tasks.lifeHabits||[],S.tasks.lifeSports||[]).forEach(t=>{
    const isD=done(t.id);
    const n=isD?(sum[t.name]||0):0;
    const row=taskRow((t.ic?t.ic+' ':'')+t.name, isD, n);
    if(row) habitRows.push(row);
  });
  // 🎁 家长奖励 / 额外加分（无完成状态，仅展示名称 + 加分）
  const rewardRows=[];
  st.items.filter(x=> isReward(x)).forEach(x=>{ rewardRows.push('<div class="bonusrow">'+esc(x.r||'')+'　<b style="color:var(--orange)">+'+x.n+' ⭐</b></div>'); });
  const anyBlock = learnRows.length || reviewRows.length || habitRows.length || rewardRows.length;
  if(!anyBlock){
    h+='<div class="empty" style="padding:14px 0">这天还没有记录哦 🦕</div>';
  } else {
    h+=board('📚 学习任务', learnRows);
    h+=board('🎯 复习闯关', reviewRows);
    h+=board('🌈 生活好习惯', habitRows);
    h+=board('🎁 家长奖励 / 额外加分', rewardRows);
  }
  h+='</div>';
  return h;
}
function renderDayDetail(k){
  if(!k) return;
  $('calDetail').innerHTML = buildDayDetailHTML(k);
}
function lessonTitle(id){
  let out=id;
  D.hanzi.forEach(b=> b.lessons.forEach(l=>{ if(('b'+b.book+'l'+l.n)===id) out='第'+b.book+'册第'+l.n+'课 '+l.title; }));
  return out;
}

  // 玩具 & 心愿（已兑换 + 待兑换 混排，按时间排序；待兑换虚线灰调角标）

  if(all.length){
    h+='<div class="rwdgrid">';

let exchImgData = ''; // 临时存储上传图片的base64
function openExchange(editIdx){
  const rec = (editIdx!=null) ? S.rewardLog[editIdx] : null;
  exchImgData = rec ? (rec.img||'') : '';
  const isEdit = (editIdx!=null);
  const btnRow = isEdit
    ? '<button data-ok class="pbtn" style="flex:1;background:var(--orange);color:#fff;padding:14px;border-radius:14px;font-size:16px;font-weight:800;border:none">保存修改</button>'
      +'<button onclick="closePop()" style="flex:1;padding:14px;border-radius:14px;font-size:16px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--sub)">取消</button>'
    : '<button id="exchConfirmBtn" class="pbtn" style="flex:1;background:var(--orange);color:#fff;padding:14px;border-radius:14px;font-size:16px;font-weight:800;border:none" onclick="exchConfirm()">确认兑换</button>'
      +'<button id="exchWishBtn" class="pbtn" style="flex:1;background:#fff;color:var(--blue);padding:14px;border-radius:14px;font-size:16px;font-weight:800;border:2px solid var(--blue)" onclick="exchAddWish()">🎯 加入待兑换</button>'
      +'<button onclick="closePop()" style="flex:1;padding:14px;border-radius:14px;font-size:16px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--sub)">取消</button>';
  popBox(
    '<div style="text-align:center;font-weight:800;font-size:17px;margin-bottom:14px">'+(isEdit?'✏️ 编辑兑换记录':'🎁 兑换新玩具 / 奖励')+'</div>'
    +'<div style="font-size:13px;color:var(--sub);margin-bottom:12px">当前剩余积分：<b style="color:var(--orange);font-size:18px">'+S.points+'</b> 分'+(isEdit?'　·　原记录 '+rewardPts(rec)+' 分':'')+'</div>'
    +'<label style="display:block;font-size:14px;font-weight:700;margin-bottom:4px">玩具名称</label>'
    +'<input id="exchName" type="text" placeholder="例如：乐高积木" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:12px;font-size:16px;box-sizing:border-box">'
    +'<label style="display:block;font-size:14px;font-weight:700;margin:8px 0 4px">兑换积分</label>'
    +'<input id="exchPts" type="number" min="1" placeholder="需要多少积分" oninput="exchToggleBtns()" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:12px;font-size:16px;box-sizing:border-box">'
    +'<label style="display:block;font-size:14px;font-weight:700;margin:8px 0 4px">玩具图片（可选）</label>'
    +'<input id="exchImg" type="file" accept="image/*" onchange="previewExchImg(this)" style="width:100%;padding:6px;border:2px solid var(--line);border-radius:10px;font-size:14px;box-sizing:border-box">'
    +'<div id="exchImgPreview" style="margin-top:8px;text-align:center;display:none"><img id="exchPreviewImg" style="max-width:200px;max-height:160px;border-radius:12px;border:2px solid var(--line)"></div>'
    +'<div style="display:flex;gap:10px;margin-top:16px">'+btnRow+'</div>',
    isEdit ? function(){
      const name=$('exchName').value.trim();
      const pts=parseInt($('exchPts').value);
      if(!name){ toast('请输入玩具名称'); return false; }
      if(!pts || pts<=0){ toast('请输入有效积分'); return false; }
      const old=S.rewardLog[editIdx];
      const oldPts=rewardPts(old);
      const delta=oldPts-pts; // 新分更少→剩余+delta；更多→剩余-delta
      if(-delta > S.points){ toast('积分不足！当前只有 '+S.points+' 分'); return false; }

// 操作后让对应积分框“再弹一下”反馈
function bumpPts(i){var els=document.querySelectorAll('.ptscell');var el=els[i];if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
// 新增模式：积分足够 → 立即兑换
function exchConfirm(){
  const name=$('exchName').value.trim();
  const pts=parseInt($('exchPts').value);
  if(!name){ toast('请输入玩具名称'); return; }
  if(!pts || pts<=0){ toast('请输入有效积分'); return; }
  if(pts > S.points){ toast('积分不足！当前只有 '+S.points+' 分'); return; }
  S.points -= pts;
  S.rewardLog.push({name:name, pts:pts, date:today(), img:exchImgData||''});
  save(); renderRewards(); bumpPts(2); renderHome(); syncSidebar(); closePop();
  toast('🎁 兑换成功：'+name+'（-'+pts+'分）');
}
// 新增模式：积分不够也加入心愿单（待兑换）
function exchAddWish(){
  const name=$('exchName').value.trim();
  const pts=parseInt($('exchPts').value);
  if(!name){ toast('请输入玩具名称'); return; }
  if(!pts || pts<=0){ toast('请输入有效积分'); return; }
  if(!S.wishlist) S.wishlist=[];
  S.wishlist.push({name:name, pts:pts, date:today(), img:exchImgData||''});
  save(); renderRewards(); closePop();

}
// 根据已填积分，切换确认/心愿按钮状态（积分不够→确认变灰、心愿高亮）
function exchToggleBtns(){

function manageReviewLib(sub){
  sub = sub || 'hanzi';

// 把备份（纯用户数据）合并回 S：完成记录按字段全部保留；任务结构以代码为准（名称/图标/顺序）
function applyBackup(d){
  const KEEP=['doneDates','pointLog','points','fund','rewardLog','pendingReward','medals',
    'hanziSchedule','enSchedule','mathSchedule','quizDone','quizTotal','quizCount','lessonsDone',
    'wrongHanzi','wrongEn','wrongPhonics','wrongMath','phonicsDone','mathDone','mathSRSeeded',
    'lastBackup','pointsAtBackup','seedVersion','rewardSeedDone','honorResetQuiz',
    'pin','mascot','mascotName'];
  KEEP.forEach(k=>{ if(k in d) S[k]=d[k]; });
  S.tasks = def().tasks; // 结构跟代码（新增任务一定出现）；完成记录(doneDates 等)已按任务 id 保留
  save();
  runMigrations(); // 套用新版初始化的所有升级 + 重新评估荣誉
  renderHome(); closePage(); toast('导入成功');
}

const BONUS_REASONS=['奖励·三科闯关全完成','奖励·学习任务全勤','奖励·好习惯全勤','奖励·全能宝宝','奖励·每日三件套'];
function isBonusReason(r){ return BONUS_REASONS.indexOf(r)>=0; }
function _learnDoneToday(t){
  const hanzi=(S.doneDates['hanzi']||[]).includes(t);
  const ph=Object.keys(S.phonicsDone||{}).some(u=> S.phonicsDone[u]===t);
  const math=(S.doneDates['mathbook']||[]).includes(t);
  return {hanzi:hanzi, ph:ph, math:math, any:hanzi||ph||math, all:hanzi&&ph&&math, count:(hanzi?1:0)+(ph?1:0)+(math?1:0)};
}
function _chalDoneToday(t){
  const b=['hanzi','math','en'];
  const done=b.filter(x=> S.quizDone && S.quizDone[x]===t).length;
  return {done:done, any:done>0, all:done===3};
}
function _habitDoneToday(t){
  const hs=S.tasks.lifeHabits||[];
  const c=hs.filter(h=> (S.doneDates[h.id]||[]).includes(t)).length;
  return {count:c, total:hs.length, any:c>0, all:hs.length>0 && c===hs.length};
}
function scoreBonusStatus(t){
  const L=_learnDoneToday(t), C=_chalDoneToday(t), H=_habitDoneToday(t);
  return [
    {name:'三科闯关全完成', pts:5,  done:C.all,  desc:'把语文、数学、英语闯关都各玩一次'},
    {name:'学习任务全勤',   pts:5,  done:L.all,  desc:'摩比爱识字、自然拼读、摩比爱数学 都各完成 1 课'},
    {name:'好习惯全勤',     pts:3,  done:H.all,  desc:'今天的好习惯全都打勾完成'},
    {name:'全能宝宝',       pts:10, done:C.all&&L.all&&H.all, desc:'闯关三科 + 学习任务 + 好习惯 全部完成！'},
    {name:'每日三件套',     pts:5,  done:L.any&&H.any&&C.any, desc:'学习任务、好习惯、闯关 今天都至少完成 1 项'}
  ];
}
function checkDailyBonuses(){
  if(S._bc) return; S._bc=true;
  try{
    const t=today();
    const log=S.pointLog[t]||(S.pointLog[t]={earn:0,spend:0,items:[]});
    const has=(r)=> log.items.some(x=> x.r===r && x.n>0);
    const give=(r,n)=>{ if(!has(r)){ addPoints(n,r); return true; } return false; };
    const L=_learnDoneToday(t), C=_chalDoneToday(t), H=_habitDoneToday(t);
    const newly=[];
    if(C.all && give('奖励·三科闯关全完成',5))  newly.push('三科闯关全完成 +5');
    if(L.all && give('奖励·学习任务全勤',5))    newly.push('学习任务全勤 +5');
    if(H.all && give('奖励·好习惯全勤',3))      newly.push('好习惯全勤 +3');
    if(C.all&&L.all&&H.all && give('奖励·全能宝宝',10)) newly.push('全能宝宝 +10');
    if(L.any&&H.any&&C.any && give('奖励·每日三件套',5)) newly.push('每日三件套 +5');
    if(newly.length){
      save();
      toast('🏆 额外奖励达成！');
      setTimeout(()=> showBonusCelebration(newly), 450);
    }
  } finally { S._bc=false; }
}

    const state = statusDone

function activeDaysByMonth(){
  const map=new Map();
  const add=k=>{ const ym=k.slice(0,7); if(!map.has(ym)) map.set(ym,new Set()); map.get(ym).add(k); };
  for(const id in S.doneDates){ (S.doneDates[id]||[]).forEach(add); }
  const out={}; map.forEach((v,ym)=> out[ym]=v.size); return out;
}
function isConsecutiveMonth(a,b){
  const [ya,ma]=a.split('-').map(Number), [yb,mb]=b.split('-').map(Number);
  if(yb===ya && mb===ma+1) return true;
  if(mb===1 && ma===12 && yb===ya+1) return true;
  return false;
}
function twoMonthFull(){
  const m=activeDaysByMonth(); const keys=Object.keys(m).sort();
  for(let i=1;i<keys.length;i++){ if(isConsecutiveMonth(keys[i-1],keys[i]) && m[keys[i-1]]>=28 && m[keys[i]]>=28) return true; }
  return false;
}
function allSixOneDay(){
  const L=S.tasks.learning||[]; if(L.length<6) return false;
  let inter=new Set(S.doneDates[L[0].id]||[]);
  for(let i=1;i<L.length;i++){ const n=new Set(); (S.doneDates[L[i].id]||[]).forEach(d=>{ if(inter.has(d)) n.add(d); }); inter=n; if(inter.size===0) return false; }
  return inter.size>0;
}

function checkMedals(silent){
  let changed=false;
  HONORS.forEach(h=>{
    let c; try{ c=h.cur(S); }catch(e){ c=0; }
    if(c>=h.goal && !S.medals[h.id]){
      S.medals[h.id]=today();
      changed=true;
      if(!silent) toast('🏅 解锁荣誉：'+h.t);
    }
  });
  save();
}

// 把一次性迁移 + 荣誉评估封装成 runMigrations()，加载时跑一次，导入备份后也会重跑（套用新版所有升级）。
function runMigrations(){
  // ---------- 7月历史数据一次性回填（已删除幼儿园课程/摩比思维机）----------
  // 仅当尚未回填过(seedVersion !== 'july2026')时写入；写入一次后标记，之后不再覆盖新数据
  if(S.seedVersion !== 'july2026'){
    Object.assign(S, JULY_SEED);
    S.seedVersion = 'july2026';
    save();
  }
  // 一次性补录「火箭积木玩具」兑换记录（650 积分），并同步扣减可用积分
  if(!S.rewardSeedDone){
    S.rewardLog.push({name:'火箭积木玩具', pts:650, date: today(), img:'assets/jpg_619.jpg'});
    S.points = Math.max(0, (S.points||0) - 650);
    S.rewardSeedDone = true;
    save();
  }
  // 一次性重置：识字/数学荣誉原按"已学数量"点亮，现改为按"复习闯关次数"判定。
  // 清掉这两类在旧指标下已点亮的记录，使其随真实闯关活动重新点亮。仅执行一次。
  if(!S.honorResetQuiz){
    ['hanzi5','hanzi10','hanzi25','hanzi50','hanzi100','hanzi200','hanzi400','hanzi700','hanzi1000','hanzi1500',
     'math5','math10','math20','math30','math50','math100','math200','math400','math800','math1500'
    ].forEach(id=>{ if(S.medals && S.medals[id]) delete S.medals[id]; });
    S.honorResetQuiz = true;
    save();
  }
  // 自修复：S.points 始终与“累计获得 - 已兑换”对齐（从得分记录反推，不丢分）。
  // 早期的一处“一次性迁移”曾在还没有种子数据时就把 flag 置位、导致之后再也不修复，
  // 历史数据里的 S.points 因此卡在旧值（如 750）。改为每次加载都对齐：
  // 正常操作后 S.points 与记录本就同步，此步仅纠偏历史脏数据，对正常数据无副作用。
  S.points = Math.max(0, totalEarned() - totalRedeemed());
  S.pointsRepaired = true;
  save();
  // 一次性修复：补全「火箭积木玩具」兑换记录的图片（原 base64 已损坏丢失）
  if(!S.rocketImgFixed){
    (S.rewardLog||[]).forEach(function(r){
      if(r && r.name==='火箭积木玩具' && (!r.img || r.img.indexOf('blob_id')>=0 || r.img.length<500)){
        r.img = 'assets/jpg_620.jpg';
      }
    });
    S.rocketImgFixed = true;
    save();
  }
  checkMedals(true); // 静默评估所有荣誉（不弹 toast）
}
