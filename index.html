<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ethan 的学习工作台</title>
<style>
:root{
  --blue:#3FA7FF; --green:#46C99B; --orange:#FF9F43; --yellow:#FFD45E;
  --bg:#F2F8FF; --card:#FFFFFF; --ink:#2E3A4B; --sub:#8A98A8; --line:#E6EEF6;
  --red:#FF6B6B; --good:#46C99B;
  --sbw:0px; /* 左侧导航栏宽度，由媒体查询在 Pad 模式覆盖 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;height:100svh;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
#home{flex:1 1 0%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.header{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;padding:16px 18px 14px;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between}
.header .who{display:flex;align-items:center;gap:10px}
.header .mascot{font-size:30px}
.header .name{font-size:18px;font-weight:700}
.header .stats{display:flex;gap:14px;text-align:center}
.header .stats .s{font-size:13px;opacity:.95}
.header .checklist-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-size:17px;cursor:pointer;flex:0 0 auto;margin-left:2px}
.header .checklist-ic:active{transform:scale(.92);background:rgba(255,255,255,.34)}
.header .stats .s b{display:block;font-size:18px;font-weight:800}
.section{padding:14px 16px}
.section h3{margin:6px 2px 10px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.section h3 .tag{font-size:11px;background:var(--line);color:var(--sub);padding:1px 7px;border-radius:8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(60,120,200,.07);display:flex;align-items:center;gap:12px}
.card .ic{font-size:26px;width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.card .txt{flex:1}
.card .txt .t{font-size:16px;font-weight:700}
.card .txt .d{font-size:12px;color:var(--sub);margin-top:2px}
.card .go{font-size:13px;color:var(--blue);font-weight:700;background:var(--bg);padding:7px 12px;border-radius:20px}
.card.done{position:relative;background:linear-gradient(135deg,#FFF7E0,#FFE9B4);border:2px solid #FFC94B;box-shadow:0 4px 16px rgba(255,180,40,.32);animation:medalGlow 2.2s ease-in-out infinite}
.card.done .ic{background:linear-gradient(135deg,#FFE9B4,#FFD24B)}
.card.done .txt .t{color:#7a5a00}
.card.done .txt .d{color:#a87f1f}
.card.done .go{background:linear-gradient(135deg,#FFD24B,#FF9F1C);color:#fff;animation:medalPulse 1.6s ease-in-out infinite}
.bonusbtn{width:30px;height:30px;border-radius:50%;border:none;background:var(--orange);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(255,159,67,.4);margin-left:2px}
.bonusbtn:active{transform:scale(.92)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--sub);margin-right:5px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:0 0 24px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.task.done .box{background:linear-gradient(135deg,#FFD24B,#FF9F1C);border-color:#FF9F1C;box-shadow:0 2px 6px rgba(255,160,20,.5);font-size:14px}
.task.done .lab{color:#7a5a00;font-weight:800;text-decoration:none}
.task .lab{flex:1;font-size:15px;font-weight:600}
.review-card{background:linear-gradient(135deg,#FFF3E0,#FFE9D6);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.review-card .ic{font-size:28px}
.review-card .txt{flex:1}
.review-card .txt .t{font-size:16px;font-weight:800;color:#E8821E}
.review-card .txt .d{font-size:12px;color:#B98A5E}
.review-card .go{font-size:13px;font-weight:800;color:#fff;background:var(--orange);padding:8px 14px;border-radius:20px}
.review-card.done{outline:2px solid var(--good);outline-offset:-2px}
.review-card .go.done-today{background:var(--good)!important;color:#fff}
.due{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:10px;padding:1px 7px;vertical-align:middle}
/* 首页网格：学习任务每行2个，复习闯关一排3个 */
.tasks-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.review-grid .review-card{flex-direction:column;text-align:center;padding:14px 6px;gap:7px}
.review-grid .review-card .ic{font-size:30px}
.review-grid .review-card .txt .t{font-size:14px;font-weight:800}
.review-grid .review-card .txt .d{font-size:10px;line-height:1.3;margin-top:2px}
.review-grid .review-card .go{font-size:11px;padding:5px 9px;border-radius:14px;margin-top:1px}
.addbtn{position:fixed;right:18px;bottom:90px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,159,67,.5);z-index:30;border:none}
.nav{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 10px rgba(60,120,200,.08)}
.nav button{flex:1;background:none;border:none;padding:8px 0 9px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ni{font-size:21px}
.nav button.on{color:var(--blue)}
.nav button.on .ni{transform:scale(1.12)}
/* 左侧导航栏（Pad 横/竖屏显示，手机隐藏） */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:0;display:none;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:30;overflow:hidden}
.sb-head{padding:20px 16px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sb-title{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden}
.sb-pts{font-size:12px;color:var(--sub);white-space:nowrap}
.sb-pts b{color:var(--orange);font-size:17px;font-weight:800}
.sb-nav{display:flex;flex-direction:column;padding:12px 10px;gap:5px;flex:1 1 auto;overflow-y:auto}
.sidebar button{display:flex;align-items:center;gap:13px;background:none;border:none;padding:13px 14px;border-radius:14px;color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.sidebar button .ni{font-size:22px;flex:0 0 auto;line-height:1}
.sidebar button.on{background:var(--bg);color:var(--blue)}
.sidebar button.on .ni{transform:scale(1.12)}
.sb-label{display:none}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.cal-head .mtitle{font-size:17px;font-weight:800;flex:1;text-align:center}
.cal-head button{background:var(--card);border:none;border-radius:12px;padding:8px 15px;font-size:15px;font-weight:800;color:var(--blue);box-shadow:0 2px 8px rgba(60,120,200,.06)}
.cal-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cal-sum .b{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.cal-sum .b b{display:block;font-size:19px;font-weight:800;color:var(--blue);line-height:1.2}
.cal-sum .b span{font-size:10px;color:var(--sub)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{font-size:11px;color:var(--sub);text-align:center;font-weight:700;padding-bottom:2px}
.cal-cell{background:var(--card);border-radius:12px;min-height:60px;padding:5px 3px 5px;text-align:center;box-shadow:0 2px 6px rgba(60,120,200,.05);border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between}
.cal-cell.blank{background:transparent;box-shadow:none;border-color:transparent}
.cal-cell .dn{font-size:13px;font-weight:800}
.cal-cell.none .dn{color:#C3CFDB;font-weight:600}
.cal-cell .pt{font-size:11px;font-weight:800;color:var(--orange);line-height:1.2}
.cal-cell .pt.zero{color:#D5DEE7}
.cal-cell .bar{height:5px;border-radius:3px;background:var(--line);margin:0 2px;overflow:hidden}
.cal-cell .bar i{display:block;height:100%;border-radius:3px}
.cal-cell.today{border-color:var(--blue)}
.cal-cell.sel{border-color:var(--orange);background:#FFF8EF}
.cal-legend{font-size:11px;color:var(--sub);margin-top:10px;text-align:center}
.cal-legend em{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 3px 0 10px;vertical-align:-1px}
.cal-detail{background:var(--card);border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 3px 10px rgba(60,120,200,.07)}
.cal-detail h4{margin:0 0 4px;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.cal-detail .sub{font-size:12px;color:var(--sub);margin-bottom:10px}
.cal-detail .grp{font-size:13px;font-weight:800;margin:10px 0 6px}
.cal-tag{display:inline-block;font-size:12px;background:var(--bg);color:var(--sub);border-radius:10px;padding:4px 10px;margin:0 6px 6px 0;font-weight:600}
.cal-tag.b{background:#E8F4FF;color:#2E6FD8}
.cal-tag.g{background:#E9F9F2;color:#2FA37B}
.cal-tag.o{background:#FFF1E2;color:#D9822B}
.daytbl{width:100%;border-collapse:collapse;margin:4px 0 2px;font-size:13px}
.daytbl th{text-align:left;color:var(--sub);font-weight:700;font-size:12px;padding:6px 8px;border-bottom:2px solid var(--line)}
.daytbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.daytbl td.dtask{font-weight:600;color:var(--ink)}
.daytbl tr:last-child td{border-bottom:none}
.scoreline{font-size:14px;margin-bottom:6px}
.bonusrow{font-size:13px;padding:3px 0;color:var(--ink)}
.cal-tag.r{background:#FFECEC;color:#E05A5A}
.trend{display:flex;align-items:flex-end;gap:6px;height:82px;margin-top:8px}
.trend .tb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.trend .tb i{display:block;width:100%;background:linear-gradient(180deg,var(--blue),var(--green));border-radius:6px 6px 0 0;min-height:3px}
.trend .tb u{font-size:10px;color:var(--orange);font-weight:800;text-decoration:none}
.trend .tb span{font-size:10px;color:var(--sub)}
/* overlay pages */
.page{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100svh;background:var(--bg);z-index:40;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.show{display:flex;animation:pageIn .22s ease}
@keyframes pageIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 页面内部内容居中限宽，背景铺满视口（不再像弹框） */
.page>.topbar,.page>.content{max-width:480px;margin:0 auto;width:100%}
.app-hidden{display:none!important}
.topbar{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.topbar .back{font-size:22px;color:var(--blue);background:none;border:none}
.topbar .tt{font-size:17px;font-weight:800}
.topbar .rt{margin-left:auto;font-size:13px;color:var(--sub)}
.content{padding:14px 16px;flex:1}
.bigbtn{display:block;width:100%;text-align:left;background:var(--card);border:none;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(60,120,200,.07);font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:12px}
.bigbtn .ic{font-size:26px}
/* session */
.session{display:flex;flex-direction:column;height:100%}
.session .hero{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-radius:18px;padding:20px;margin:14px 16px;text-align:center}
.session .hero .ti{font-size:20px;font-weight:800;margin-bottom:6px}
.session .hero .enc{font-size:14px;opacity:.9;margin-bottom:14px}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.timer-btn{margin-top:10px;background:rgba(255,255,255,.25);border:none;color:#fff;padding:7px 18px;border-radius:20px;font-size:14px;font-weight:700}
.encourage{text-align:center;font-size:15px;color:var(--sub);margin:auto 16px;line-height:1.7}
.mascot-talk{font-size:46px;text-align:center;margin-bottom:8px}
.finish-btn{margin:14px 16px 24px;background:var(--green);color:#fff;border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:800}
/* lesson picker — 上下两行布局，防窄屏换行 */
.lesson{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.lesson .row1{display:flex;align-items:center;gap:10px}
.lesson .ln{font-size:12px;background:var(--bg);color:var(--sub);border-radius:8px;padding:4px 10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.lesson .lt{flex:1;font-size:16px;font-weight:800;min-width:0;line-height:1.4}
.lesson .go{font-size:13px;font-weight:800;color:#fff;background:var(--blue);padding:8px 15px;border-radius:18px;border:none;white-space:nowrap;flex-shrink:0}
.lesson .chlist{font-size:13px;color:var(--sub);font-weight:500;margin-top:5px;letter-spacing:4px;word-break:keep-all;line-height:1.6}
.lesson.rec{outline:2px solid var(--orange)}
.bookhead{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#E3F0FF,#D6E8FF);border-radius:14px;padding:13px 15px;margin:12px 0 8px;cursor:pointer;user-select:none}
.bookhead.open{background:linear-gradient(135deg,var(--blue),#5FBFEA);color:#fff}
.bookhead .bt{flex:1;font-size:15px;font-weight:800;color:#2E6FD8}
.bookhead.open .bt{color:#fff}
.bookhead .bp{font-size:12px;font-weight:700;color:#5B7FA8;background:rgba(255,255,255,.75);padding:3px 9px;border-radius:10px;white-space:nowrap}
.bookhead .bc{font-size:14px;font-weight:800;color:#2E6FD8}
.bookhead.open .bc{color:#fff}
.lesson .st{display:inline-block;font-size:12px;color:var(--good);font-weight:700;margin-top:3px}
/* quiz */
.qchar{font-size:64px;text-align:center;font-weight:800;margin:18px 0;color:var(--ink)}
.qpinyin{text-align:center;font-size:20px;color:var(--blue);font-weight:700;margin-bottom:6px}
.qsent{text-align:center;font-weight:800;font-size:21px;line-height:1.8;margin:14px 6px;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:var(--good);background:#EAFaf3;color:var(--good)}
.opt.wrong{border-color:var(--red);background:#FFEDED;color:var(--red)}
.opt.shake{animation:fbShake .45s}
.opt .em{font-size:30px;display:block}
.qprog{text-align:center;font-size:13px;color:var(--sub);margin-bottom:6px}
.qhint{position:relative;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFF1C9,#FFD98A);border:2.5px solid #FFC24B;border-radius:18px;padding:11px 15px;margin:4px 0 14px;font-size:16px;font-weight:800;color:#8A5A00;line-height:1.4;box-shadow:0 4px 0 rgba(255,194,75,.45);text-align:left}
.qhint::before{content:'';position:absolute;top:-11px;left:26px;border:7px solid transparent;border-bottom-color:#FFC24B}
.qhint .hi-ic{font-size:22px;flex:0 0 auto}
.speak-btn{display:block;margin:2px auto 14px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5CC8FF,#3A8DFF);border:none;border-radius:18px;padding:12px 26px;box-shadow:0 4px 0 rgba(58,141,255,.4);cursor:pointer}
.speak-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,141,255,.4)}
.speak-btn{display:block;margin:0 auto 8px;background:var(--blue);color:#fff;border:none;border-radius:30px;padding:10px 22px;font-size:15px;font-weight:700}
.reveal{background:#FFF8E8;border-radius:14px;padding:14px;margin-top:12px;text-align:center;display:none}
.reveal.show{display:block}
.reveal .em{font-size:40px}
.reveal .en{font-size:22px;font-weight:800}
.reveal .zh{font-size:16px;color:var(--sub)}
.next-btn{margin-top:10px;width:100%;background:var(--orange);color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
/* keypad */
.eq{font-size:40px;text-align:center;font-weight:800;margin:20px 0}
.eq .ans{color:var(--blue);border-bottom:3px solid var(--blue);min-width:60px;display:inline-block;min-height:46px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:280px;margin:10px auto}
.keypad button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;font-size:22px;font-weight:800;box-shadow:0 2px 6px rgba(60,120,200,.06)}
.keypad button:active{transform:scale(.96)}
.keypad .ok{background:var(--green);color:#fff;border-color:var(--green)}
.keypad .cl{background:var(--bg);color:var(--sub)}
/* rewards */
.fund{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:12px}
.fund .big{font-size:40px;font-weight:900}
.fund .lbl{font-size:13px;opacity:.95}
.ptsbox{display:flex;gap:10px;margin:14px 0}
.ptscell{flex:1;border-radius:16px;padding:14px 6px;text-align:center;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(60,120,200,.12);display:flex;flex-direction:column;align-items:center;animation:ptsPop .55s cubic-bezier(.34,1.56,.64,1) both}
.ptscell:nth-child(1){background:linear-gradient(135deg,#E8F4FF,#D0EAFF);animation-delay:0s}
.ptscell:nth-child(2){background:linear-gradient(135deg,#FFF3E0,#FFE8CC);animation-delay:.12s}
.ptscell:nth-child(3){background:linear-gradient(135deg,#E8FFE8,#CCFFCC);animation-delay:.24s}
.ptscell .ico{font-size:26px;line-height:1;margin-bottom:3px}
.ptscell .ptxt{display:flex;flex-direction:column;align-items:center}
.ptscell .pv{font-size:32px;font-weight:900;line-height:1.15;display:block}
.ptscell:nth-child(1) .pv{color:#1A7ACC}
.ptscell:nth-child(2) .pv{color:#D97706}
.ptscell:nth-child(3) .pv{color:#2DA44A}
.ptscell .pl{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px;display:block}
@keyframes ptsPop{0%{opacity:0;transform:translateY(16px) scale(.94)}60%{opacity:1;transform:translateY(-5px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
.ptscell.bump{animation:ptsPop .5s cubic-bezier(.34,1.56,.64,1) both}
.rwdgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:4px}
.rwdcard{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(60,120,200,.08);display:flex;flex-direction:column;min-width:0}
.rwdthumbwrap{position:relative;width:100%;aspect-ratio:1/1;background:#f3f6fb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rwdthumb{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.rwdthumb.emoji{font-size:54px;cursor:default}
.rwdedit,.rwddel{position:absolute;top:6px;width:30px;height:30px;border:none;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rwdedit{right:44px}
.rwddel{right:6px}
.rwdname{font-size:15px;font-weight:800;padding:8px 10px 2px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwdpts2{font-size:14px;font-weight:800;color:var(--orange);padding:0 10px}
.rwddate2{font-size:11px;color:var(--sub);padding:3px 10px 10px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px}
.lightbox img{max-width:92%;max-height:78%;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:contain}
.lightbox .lbc{color:#fff;font-size:13px;margin-top:16px;opacity:.85}
@media(min-width:600px){ .rwdgrid{grid-template-columns:repeat(3,1fr);gap:14px} }
@media(min-width:1024px){ .rwdgrid{grid-template-columns:repeat(4,1fr);gap:16px} }
/* 待兑换卡片：虚线灰调 + 角标 */
.rwdcard.pending{border:2px dashed var(--line);background:#fafbfc;box-shadow:none}
.rwdcard.pending .rwdthumbwrap{background:#eef1f6}
.rwdcard.pending .rwdthumb{opacity:.55;filter:grayscale(.65)}
.rwdcard.pending .rwdthumbwrap::after{content:"🔒 待兑换";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,50,70,.5);color:#fff;font-size:15px;font-weight:800;letter-spacing:1px;z-index:1;pointer-events:none}
.rwdcard.pending .rwdthumb.emoji{opacity:.6;filter:grayscale(.5)}
.rwdbadge{position:absolute;top:6px;left:6px;z-index:2;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#9aa7b8,#7c8aa0);padding:3px 8px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.rwdprog{height:8px;background:#e9edf3;border-radius:6px;margin:6px 10px 0;overflow:hidden}
.rwdprog > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7ed957);border-radius:6px;transition:width .35s ease}
.honor-go{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px rgba(60,80,120,.06);cursor:pointer}
.honor-go:active{background:#f0f4f9}
.honor-go .hg-ic{font-size:22px;flex-shrink:0}
.honor-go .hg-txt{font-size:13px;color:#56607a;flex:1;line-height:1.5}
.honor-go .hg-txt b{color:#3A4A5E}
.honor-go .hg-ar{color:var(--blue);font-size:20px;font-weight:800;flex-shrink:0}
.rwdduo{font-size:12px;font-weight:800;color:var(--orange);padding:5px 10px 0;line-height:1.2}
.rwdconvbtn{margin:8px 10px 10px;padding:9px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--orange),#FFB347);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.rwdlog,.rwdrow{display:none}
.empty-tip{font-size:13px;color:var(--sub);padding:12px 2px}
.reward-item{background:var(--card);border-radius:14px;padding:13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.reward-item .ic{font-size:24px}
.reward-item .t{flex:1;font-size:15px;font-weight:700}
.reward-item .v{font-size:13px;color:var(--sub)}
.medal{display:inline-flex;flex-direction:column;align-items:center;width:30%;margin-bottom:14px}
.medal .mi{font-size:34px;filter:grayscale(1);opacity:.4}
.medal.un .mi{filter:none;opacity:1}
.medal .mt{font-size:11px;color:var(--sub);text-align:center;margin-top:3px}
.medal.un .mt{color:var(--ink);font-weight:700}
/* 荣誉墙 */
.honorTop{background:linear-gradient(135deg,var(--blue),var(--purple,#7C5CFC));color:#fff;border-radius:16px;padding:16px;text-align:center;font-size:15px;font-weight:800;margin:6px 0 4px;box-shadow:0 4px 14px rgba(60,120,200,.18)}
.honorTop b{font-size:22px}
.hcattitle{font-size:14px;font-weight:800;margin:16px 2px 8px;color:var(--ink)}
.honorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard{background:var(--card);border-radius:14px;padding:12px 6px 10px;text-align:center;box-shadow:0 2px 8px rgba(60,120,200,.06);border:2px solid transparent}
.hcard .hem{font-size:30px;filter:grayscale(1);opacity:.45}
.hcard.un{border-color:var(--yellow);background:linear-gradient(160deg,#FFF8E6,#FFF)}
.hcard.un .hem{filter:none;opacity:1}
.hcard .hname{font-size:12px;color:var(--sub);margin-top:4px;font-weight:700;line-height:1.25}
.hcard.un .hname{color:var(--ink)}
.hprog{height:6px;background:var(--line);border-radius:6px;margin:7px 6px 0;overflow:hidden}
.hbar{height:100%;background:var(--blue);border-radius:6px}
.hpct{font-size:11px;color:var(--sub);margin-top:3px}
/* habits */
.habit{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.habit .em{font-size:24px}
.habit .t{flex:1;font-size:15px;font-weight:700}
.habit .fire{font-size:14px;color:var(--orange);font-weight:800}
/* parent */
.lock{text-align:center;padding:30px 16px}
.lock .em{font-size:50px}
.lock input{font-size:22px;text-align:center;width:160px;padding:10px;border:2px solid var(--line);border-radius:12px;letter-spacing:8px;margin:14px 0}
.pbtn{display:block;width:100%;text-align:left;background:var(--card);border:none;border-radius:14px;padding:14px;margin-bottom:9px;font-size:15px;font-weight:700;box-shadow:0 2px 8px rgba(60,120,200,.06);display:flex;align-items:center;gap:10px}
.pbtn .ic{font-size:22px}
.seg{display:flex;gap:6px;margin:4px 0}
.seg button{flex:1;padding:10px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-weight:800;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:center;justify-content:center}
.pop.show{display:flex}
.pop .box{position:relative;background:#fff;border-radius:18px;padding:20px;width:80%;max-width:320px;text-align:center}
.pop .box .popx{position:absolute;top:8px;right:10px;width:30px;height:30px;line-height:28px;text-align:center;border:none;background:transparent;font-size:20px;color:#bbb;cursor:pointer;border-radius:50%;padding:0}
.pop .box .popx:hover{background:var(--bg);color:#888}
.pop .box .opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.pop .box .opts button{flex:1;min-width:60px;background:var(--bg);border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:800;color:var(--blue)}
.pop .box input{width:90%;padding:10px;border:2px solid var(--line);border-radius:10px;font-size:18px;text-align:center;margin:8px 0}
.pop .box .opts button.sel{background:var(--blue);color:#fff}
.pop .box .opts button.primary{flex-basis:100%;background:var(--blue);color:#fff}
.pop .box{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.pop .box::-webkit-scrollbar{display:none}
.pop .box.bk{text-align:left}
.bktitle{font-weight:800;margin:12px 0 4px;text-align:left;font-size:14px;color:var(--blue)}
.bklist{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:4px 0}
.bklist label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);padding:7px 8px;border-radius:8px;cursor:pointer}
.bklist input{width:16px;height:16px;flex:0 0 16px}
.mini{display:inline-block;background:linear-gradient(135deg,var(--orange),var(--yellow));color:#fff;border:none;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;cursor:pointer}
.stats .s.clickable{cursor:pointer}
.stats .s.clickable:active{opacity:.6}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(46,58,75,.95);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
/* 答题反馈大层 */
#fbOverlay{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
#fbOverlay.show{display:flex}
#fbOverlay.ok{background:rgba(70,201,155,.94)}
#fbOverlay.no{background:rgba(255,138,107,.94)}
#fbOverlay .fb-emoji{font-size:130px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18));animation:fbPop .45s cubic-bezier(.2,1.5,.4,1)}
#fbOverlay.no .fb-emoji{animation:fbShake .55s}
#fbOverlay .fb-text{font-size:44px;font-weight:900;color:#fff;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.18);animation:fbPop .45s .05s both cubic-bezier(.2,1.5,.4,1)}
#fbOverlay .fb-hint{font-size:21px;color:#fff;margin-top:12px;background:rgba(255,255,255,.22);padding:7px 16px;border-radius:16px;font-weight:700}
.confetti{position:absolute;top:-10%;will-change:transform;animation:fbFall 1.15s linear forwards}
@keyframes fbPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes fbShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-18px) rotate(-8deg)}30%{transform:translateX(18px) rotate(8deg)}45%{transform:translateX(-13px)}60%{transform:translateX(13px)}75%{transform:translateX(-7px)}90%{transform:translateX(7px)}}
@keyframes fbFall{to{transform:translateY(118vh) rotate(380deg);opacity:.2}}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:30px 10px}
.center-emoji{font-size:50px;text-align:center;margin:10px 0}
.game-type{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game-type .gt{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(60,120,200,.06)}
.game-type .gt .ic{font-size:30px}
.game-type .gt .t{font-size:14px;font-weight:700;margin-top:4px}

/* ===== Pad 竖屏（≥600px）：左侧窄导航栏（纯图标）+ 内容铺满 ===== */
@media (min-width:600px){
  :root{--sbw:76px}
  .nav{display:none}
  .sidebar{display:flex;width:76px}
  .sb-head{display:none}
  .sb-nav{padding:16px 6px;gap:8px}
  .sidebar button{justify-content:center;padding:16px 0;gap:0}
  .sidebar button .ni{font-size:25px}
  .sb-label{display:none}
  #app{margin-left:var(--sbw);max-width:none;width:calc(100% - var(--sbw))}
  #app>.header,#home{max-width:100%;margin-left:0;margin-right:0}
  #home{padding-bottom:18px}
  .page{left:var(--sbw)}
  .back{display:none}
  .addbtn{right:28px;bottom:28px}
  /* Pad 窄栏：tasks-grid 3 列 */
  .tasks-grid{grid-template-columns:repeat(3,1fr)}
}

  .header{padding:20px 28px 18px;border-radius:0 0 28px 28px}

  .header .name{font-size:22px}
  .header .stats .s{font-size:15px}
  .header .stats .s b{font-size:22px}
  .section{padding:18px 24px}
  .section h3{font-size:17px}
  .card{padding:18px 16px;gap:16px}
  .card .ic{font-size:32px;width:52px;height:52px;flex:0 0 52px;border-radius:14px}
  .card .txt .t{font-size:19px}
  .card .txt .d{font-size:13px}
  .card .go{font-size:15px;padding:9px 18px;border-radius:24px}

  .nav{max-width:900px}

  .topbar{padding:18px 24px}
  .topbar .tt{font-size:20px}
  .bigbtn{padding:20px 16px;font-size:18px}
  .bigbtn .ic{font-size:32px}
  /* 生活/体育分两栏 */
  .life-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .life-col h4{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .addbtn{width:60px;height:60px;font-size:34px;bottom:84px;right:28px}
  .session .hero{padding:28px;margin:20px 24px}
  .session .hero .ti{font-size:24px}
  .timer{font-size:42px}
  .finish-btn{margin:20px 24px 30px;padding:20px;font-size:20px}
  .lesson{padding:16px 14px;gap:14px}
  .lesson .lt{font-size:17px}
  .lesson .go{padding:9px 18px;font-size:15px}
  .keypad{max-width:340px;gap:11px}
  .keypad button{padding:20px;font-size:26px}
  .opts{gap:14px}
  .opt{padding:20px 12px;font-size:21px}
  .qchar{font-size:76px;margin:22px 0}
  .fund{padding:26px}
  .fund .big{font-size:48px}
  .habit{padding:14px 14px}
  .habit .t{font-size:17px}
  .pbtn{padding:17px;font-size:17px}
  .medal .mi{font-size:40px}
  .ptscell{flex-direction:row;justify-content:center;gap:16px;padding:24px 18px;border-radius:20px}
  .ptscell .ico{font-size:42px;margin:0}
  .ptscell .ptxt{align-items:flex-start}
  .ptscell .pv{font-size:40px}
  .ptscell .pl{font-size:15px}
  /* 日历放大 */
  .cal-grid{gap:9px}
  .cal-cell{min-height:86px;padding:8px 5px;border-radius:14px}
  .cal-cell .dn{font-size:16px}
  .cal-cell .pt{font-size:13px}
  .cal-cell .bar{height:6px}
  .cal-wd{font-size:13px}
  .cal-head .mtitle{font-size:20px}
  .cal-sum .b b{font-size:24px}
  .cal-sum .b span{font-size:12px}

  .cal-tag{font-size:14px;padding:6px 12px}

  /* Pad 宽屏：tasks-grid 卡片恢复水平布局 */
  .tasks-grid .card{ flex-direction:row; text-align:left; padding:18px 16px; gap:16px; align-items:center }
  .tasks-grid .card .ic{ font-size:32px; width:52px; height:52px; flex:0 0 52px; border-radius:14px; background:var(--bg) }

@media (min-width:1024px){

  .sidebar{width:190px}
  .sb-head{display:flex}
  .sidebar button{justify-content:flex-start;padding:13px 14px;gap:13px}
  .sidebar button .ni{font-size:22px}
  .sb-label{display:inline}
  #app{width:calc(100% - var(--sbw))}
  #app>.header,#home{max-width:100%}
  .page>.topbar,.page>.content{max-width:100%}
  /* Pad 横屏：tasks-grid 4 列，review-grid 可保留3列或加宽 */
  .tasks-grid{grid-template-columns:repeat(4,1fr);gap:14px}
}

/* ===== 窄屏防竖排：tasks-grid 卡片垂直化（同 review-grid 策略） ===== */
.tasks-grid .card{ flex-direction:column; text-align:center; padding:14px 8px 10px; gap:7px; align-items:center }
.tasks-grid .card .ic{ font-size:34px; width:auto; height:auto; flex:none; background:none; border-radius:0 }
.tasks-grid .card .txt{ flex:none; text-align:center }
.tasks-grid .card .txt .t{ font-size:14px; font-weight:800 }
.tasks-grid .card .txt .d{ font-size:10px; line-height:1.3 }
.tasks-grid .card .bonusbtn{ position:absolute; right:6px; top:6px; width:26px; height:26px; font-size:16px }
.tasks-grid .card{ position:relative }
.tasks-grid .card .go{ font-size:11px; padding:5px 10px; border-radius:14px; margin-top:1px }

/* ===== 防窄屏文字竖排：通用 flex/grid 子项允许收缩 ===== */
.card,.review-card,.task,.lesson,.opt,.bookhead,.sidebar button,.topbar,.bigbtn,.cal-cell,.cal-sum .b,.stats .s,.seg button,.habit,.medal,.fund,.pbtn,.card .go,.review-card .go { min-width:0; }
.card .txt,.review-card .txt,.task .lab,.lesson .lt,.bookhead .bt,.topbar .tt,.sidebar button span { min-width:0; }
body{ overflow-wrap:break-word; }
.qprog,.qhint,.reveal,.cal-detail,.daytbl td,.cal-tag,.bktitle,.empty,.lesson .chlist { overflow-wrap:break-word; }

/* ===== Pad 宽屏：弹窗放大适配（修复补录等弹框窄条） ===== */
@media (min-width:768px){
  .pop .box{ max-width:600px; padding:28px; }
  .pop .box .opts{ gap:12px }
  .pop .box input{ font-size:20px; padding:12px }
  .pop .box .bktitle{ font-size:16px }
  .bklist{ grid-template-columns:repeat(3,1fr); gap:8px 12px }
  .bklist label{ font-size:15px; padding:10px 8px }
}
/* Pad 横屏：清单/奖励弹框适当加宽，更好利用横向空间 */
@media (min-width:1024px){ .pop .box.bk{ max-width:688px } }
/* ---------- 闯关配置面板（V2） ---------- */

.sc-bonus-main{display:flex;align-items:center;gap:8px}
.sc-bonus-ic{flex:0 0 auto;font-size:18px}
.sc-bonus-name{flex:1;font-size:13px;font-weight:800;color:var(--ink)}

<script>
const D = window.APP_DATA;
const KEY = 'ethan_learning_v1';
// ===== 云端同步（腾讯云 CloudBase）=====
var CLOUD = {
  env: 'ethan-learning2026-d0c41ee5f0d46', appid: '1257058645',
  passHash: '5c59386',
  coll: 'ethan_state',
  docId: 'ethan_shared',
  ready: false, app: null, db: null
};
var _passEntered = null;
var _pushTimer = null;
var _localWarned = false;
function _syncBadge(state){
  try{
    var b = document.getElementById('syncBadge');
    if(!b){
      b = document.createElement('div');
      b.id = 'syncBadge';
      b.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99990;font:600 11px/1.4 -apple-system,sans-serif;padding:5px 9px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;opacity:.92';
      (document.body||document.documentElement).appendChild(b);
    }
    if(state==='ok'){ b.textContent='☁️ 已同步'; b.style.background='#2ecc71'; b.style.color='#fff'; }
    else if(state==='local'){ b.textContent='📱 仅本机'; b.style.background='#f39c12'; b.style.color='#fff'; }
    else if(state==='err'){ b.textContent='☁️ 同步失败'; b.style.background='#e74c3c'; b.style.color='#fff'; }
    else if(state==='wait'){ b.textContent='☁️ 同步中…'; b.style.background='#3498db'; b.style.color='#fff'; }
  }catch(e){}
}
function _ph(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h.toString(16); }
function cloudInit(){
  return new Promise(function(res){
    try{
      if(typeof cloudbase==='undefined'){ res(false); return; }
      // IIFE bundle may expose {default: init} or init directly; npm uses cloudbase.init()
      var raw = (cloudbase && typeof cloudbase==='object' && cloudbase.default) ? cloudbase.default : cloudbase;
      var initFn = (typeof raw.init==='function') ? raw.init : raw;
      var app = initFn({ env: CLOUD.env });
      CLOUD.app = app; CLOUD.db = app.database();
      CLOUD.ready = true; res(true);
    }catch(e){ res(false); }
  });
}
function askPass(){
  return new Promise(function(resolve){
    var saved = null;
    try{ saved = localStorage.getItem('ethan_cloud_pass'); }catch(e){}
    if(saved === CLOUD.passHash){ _passEntered = saved; resolve(saved); return; }
    if(_passEntered){ resolve(_passEntered); return; }
    popBox('<div style="font-weight:600;margin-bottom:6px">🔐 云端同步口令</div><div style="color:#888;font-size:13px;margin-bottom:8px">输入口令即可把学习记录同步到云端，任何设备输入同一口令都能查看。</div><input id="cpass" type="password" placeholder="请输入口令" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;box-sizing:border-box"><div class="opts"><button data-ok>确定</button></div>',
      function(){
        var inp = document.getElementById('cpass');
        var v = inp ? inp.value : '';
        if(_ph(v) === CLOUD.passHash){
          _passEntered = v;
          try{ localStorage.setItem('ethan_cloud_pass', CLOUD.passHash); }catch(e){}
          resolve(v);
        } else { toast('口令错误'); resolve(null); }
        return true;
      });
  });
}
function cloudPush(){
  if(!CLOUD.ready){
    if(_syncBadge) _syncBadge('local');
    return;
  }
  // 口令已在本机保存过则自动复用，避免“启动时关掉口令框导致永远不同步”
  if(!_passEntered){
    try{ var sp = localStorage.getItem('ethan_cloud_pass'); if(sp === CLOUD.passHash) _passEntered = sp; }catch(e){}
  }
  if(!_passEntered){
    if(!_localWarned){ _localWarned = true; toast('未设置云端口令，数据仅保存在本机'); }
    if(_syncBadge) _syncBadge('local');
    return;
  }
  if(_syncBadge) _syncBadge('wait');
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(function(){
    try{
      S.ts = Date.now();
      CLOUD.db.collection(CLOUD.coll).doc(CLOUD.docId).set({ data: S, ts: S.ts, pass: _ph(_passEntered) })
        .then(function(){ if(_syncBadge) _syncBadge('ok'); })
        .catch(function(){ if(_syncBadge) _syncBadge('err'); });
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    }catch(e){ if(_syncBadge) _syncBadge('err'); }
  }, 700);
}
function cloudPull(){
  if(!CLOUD.ready) return Promise.resolve();
  return askPass().then(function(p){
    if(!p) return;
    return CLOUD.db.collection(CLOUD.coll).doc(CLOUD.docId).get().then(function(r){
      var d = r && r.data && r.data[0];
      if(d && d.data){
        var localTs = (S && S.ts) ? S.ts : 0;
        if((d.ts||0) >= localTs){
          S = d.data;
          try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
          if(typeof renderHome==='function') renderHome();
          if(_syncBadge) _syncBadge('ok');
          toast('已从云端同步');
        }
      }
    }).catch(function(){});
  });
}
function bootCloud(){
  var tries = 0;
  function wait(){
    if(typeof cloudbase!=='undefined' && cloudbase){
      var r = (typeof cloudbase==='object' && cloudbase.default) ? cloudbase.default : cloudbase;
      if(typeof r.init==='function' || typeof r==='function'){

function addPoints(n, reason, dateStr){
  n = Number(n)||0;
  S.points = Math.max(0, S.points + n);
  syncSidebar();
  const d = dateStr || today();
  if(!S.pointLog) S.pointLog = {};
  const rec = S.pointLog[d] || (S.pointLog[d] = {earn:0, spend:0, items:[]});
  if(n >= 0) rec.earn += n; else rec.spend += -n;
  rec.items.push({n:n, r:reason||''});
  if(rec.items.length > 60) rec.items.splice(0, rec.items.length-60);
  if(!S._bc) checkDailyBonuses();
}
function undoPoints(n, reason, dateStr){
  // 取消勾选：扣回分数并从当天流水移除一条同因记录
  n = Number(n)||0;
  S.points = Math.max(0, S.points - n);
  syncSidebar();
  const d = dateStr || today();
  const rec = S.pointLog && S.pointLog[d];
  if(rec){
    rec.earn = Math.max(0, rec.earn - n);
    const i = rec.items.map(x=>x.r).lastIndexOf(reason);
    if(i >= 0) rec.items.splice(i,1);
  }
}

function pickOpts(correct, distractors, n){
  n=n||4;
  const pool=shuffle((distractors||[]).filter(x=> x!==correct && x!==undefined && x!==null && x!==''));
  const taken=pool.slice(0, Math.max(0, n-1));
  return shuffle([correct].concat(taken));
}

      o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(110,t+0.35);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
      o.start(t); o.stop(t+0.40);
    }
  }catch(e){}
}

// ---------- 历史学习进度（一次性导入 + 家长可调） ----------
// 已学到：第 2~4 册为历史正确课程，预置学完；第 5、6 册为最新课文表，默认「待学习」（不预置已学）
const SEED_PROGRESS = {2:'all', 3:'all', 4:'all'};
const SEED_VERSION = 3;
function bookOf(n){ return D.hanzi.find(b=> b.book===n); }
function bookProgress(n){
  const b=bookOf(n); if(!b) return {done:0,total:0};
  let done=0; b.lessons.forEach(l=>{ if(S.lessonsDone['b'+n+'l'+l.n]) done++; });
  return {done:done, total:b.lessons.length};
}
// 把某册的 1~upto 课标记为已学；upto=0 表示清除本册进度
function setBookProgress(n, upto, opts){
  opts=opts||{};
  const b=bookOf(n); if(!b) return {lessons:0, chars:0};
  let ln=0, cn=0, i=(opts.startIndex||0);
  b.lessons.forEach(l=>{
    const id='b'+n+'l'+l.n;
    if(l.n<=upto){
      if(!S.lessonsDone[id]){ S.lessonsDone[id]= opts.date || 'seed'; ln++; }
      l.chars.forEach((c,ci)=>{
        const cid=id+'i'+ci;
        if(!S.hanziSchedule[cid]){
          // 历史学过的字：给高复习等级，到期日在未来 14 天内错峰铺开，避免一次涌出上千字
          S.hanziSchedule[cid]={due: addDays(i % 14), level: (opts.level!==undefined? opts.level : (n<=4?4:3))};
          i++; cn++;
        }
      });
    } else if(opts.clearBeyond){
      if(S.lessonsDone[id]==='seed') delete S.lessonsDone[id];
      l.chars.forEach((c,ci)=>{ delete S.hanziSchedule[id+'i'+ci]; });
    }
  });
  return {lessons:ln, chars:cn, nextIndex:i};
}
(function seedProgress(){
  // 迁移：把第 5、6 册重置为「待学习」（旧课文名有误，换最新课文表）。
  // 用独立标记 b56Reset，避免与荣誉回填的 S.seedVersion='july2026' 冲突导致迁移永不触发。
  if(!S.b56Reset){
    [5,6].forEach(bk=>{
      const b=bookOf(bk); if(!b) return;
      b.lessons.forEach(l=>{
        const id='b'+bk+'l'+l.n;
        delete S.lessonsDone[id];
        l.chars.forEach((c,ci)=> delete S.hanziSchedule[id+'i'+ci]);
      });
    });
    S.b56Reset = true;
  }
  // 第 2~4 册（历史正确课程）预置学完；第 5、6 册不预置（待学习）。setBookProgress 幂等，可重复执行。
  let idx=0, L=0, C=0;
  [1,2,3,4,5,6].forEach(bk=>{
    const spec=SEED_PROGRESS[bk]; if(spec===undefined) return;
    const b=bookOf(bk); if(!b) return;
    const upto = spec==='all' ? 9999 : spec;
    const r=setBookProgress(bk, upto, {startIndex:idx});
    idx=r.nextIndex; L+=r.lessons; C+=r.chars;
  });
  save();
  if(L||C) console.log('[seed] 已标记 '+L+' 课 / '+C+' 字为已学');
})();

(function seedPhonics(){
  if(S.phonicsSeedVersion >= PHONICS_SEED_VERSION) return;
  if(!S.phonicsDone) S.phonicsDone = {};
  const books = D.phonicsBooks || [];
  let count = 0;
  Object.entries(PHONICS_SEED).forEach(([bkStr, upTo]) => {
    const bk = parseInt(bkStr);

      if(u.n <= upTo) {
        const uid = 'b'+bk+'u'+u.n;
        if(!S.phonicsDone[uid]){ S.phonicsDone[uid] = 'seed'; count++; }
      }
    });
  });
  S.phonicsSeedVersion = PHONICS_SEED_VERSION;
  save();
  if(count) console.log('[seed-phonics] 已标记 '+count+' 个自然拼读Unit为已学');
})();

(function seedMathSRS(){
  if(S.mathSRSeeded) return;
  const facts=[];
  for(let i=0;i<40;i++){ const a=Math.floor(Math.random()*100), b=Math.floor(Math.random()*100); facts.push({op:'add',q:a+'+'+b,ans:a+b}); }
  for(let i=0;i<40;i++){ const a=Math.floor(Math.random()*100), b=Math.floor(Math.random()*(a+1)); facts.push({op:'sub',q:a+'-'+b,ans:a-b}); }
  for(let i=0;i<20;i++){ const a=Math.floor(Math.random()*9)+1, b=Math.floor(Math.random()*9)+1; facts.push({op:'mul',q:a+'×'+b,ans:a*b}); }

})();

// ---------- 家庭连续天数 ----------
function streakOf(taskId){
  const arr=(S.doneDates[taskId]||[]).slice().sort();
  if(!arr.length) return 0;
  let streak=0; let cur=new Date(); cur.setHours(0,0,0,0);
  // 允许今天或昨天的最后打卡
  function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  let last=dstr(cur);
  // 若今天没打卡，从昨日起算
  if(!arr.includes(last)){ cur.setTime(cur.getTime()-DAY); last=dstr(cur); }
  for(let i=arr.length-1;i>=0;i--){
    if(arr[i]===last){ streak++; cur.setTime(cur.getTime()-DAY); last=dstr(cur); }
    else if(arr[i] < last){ break; }
  }
  return streak;
}

function checkBackupReminder(){
  const hasData = S.points>0 || (S.doneDates && Object.keys(S.doneDates).length>0);
  if(!hasData) return;
  const todayStr=today();
  if(S.backupRemindedOn===todayStr) return;
  const daysSince = S.lastBackup? Math.round((new Date(todayStr)-new Date(S.lastBackup))/DAY) : 999;
  const earnedSince = S.lastBackup? (S.points - (S.pointsAtBackup||0)) : S.points;
  if(daysSince>=7 || earnedSince>=50){
    S.backupRemindedOn=todayStr; save();
    toast('💾 记得备份数据哦：家长中心 → 备份 / 导入');
  }
}

  if(!arr.includes(t)){ arr.push(t); addPoints(2, tk.name); }

// ---------- 数学 14 题型生成（覆盖 100 以内加减 + 乘法口诀） ----------
const MATH_TYPES = [
  {k:'add10',  label:'10以内加法'},
  {k:'sub10',  label:'10以内减法'},
  {k:'add20nc',label:'20以内不进位加法'},
  {k:'sub20nb',label:'20以内不退位减法'},
  {k:'a2_1nc', label:'两位数+一位数 不进位加法'},
  {k:'a2_1c',  label:'两位数+一位数 进位加法'},
  {k:'s2_1nb', label:'两位数-一位数 不退位减法'},
  {k:'s2_1b',  label:'两位数-一位数 退位减法'},
  {k:'a2_2nc', label:'两位数+两位数 不进位加法'},
  {k:'a2_2c',  label:'两位数+两位数 进位加法'},
  {k:'s2_2nb', label:'两位数-两位数 不退位减法'},
  {k:'s2_2b',  label:'两位数-两位数 退位减法'},
  {k:'tens',   label:'整十数加减'},
  {k:'mul',    label:'乘法口诀'}
];
function genMathByType(t){
  const rnd=(a,b)=> a+Math.floor(Math.random()*(b-a+1));
  for(let i=0;i<200;i++){
    if(t==='add10'){ const a=rnd(1,9),b=rnd(1,9); if(a+b<=10) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='sub10'){ const a=rnd(2,10),b=rnd(1,a); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='add20nc'){ const a=rnd(10,19),b=rnd(1,9); if((a%10)+b<=9 && a+b<=20) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='sub20nb'){ const a=rnd(11,20); const u=a%10; const b=rnd(1,u); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='a2_1nc'){ const a=rnd(10,99); const b=rnd(1,9); if((a%10)+b<=9) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='a2_1c'){ const a=rnd(10,99); const b=rnd(1,9); if((a%10)+b>=10) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='s2_1nb'){ const a=rnd(10,99); const u=a%10; if(u===0) continue; const b=rnd(1,u); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='s2_1b'){ const a=rnd(10,99); const u=a%10; if(u===0) continue; const b=rnd(u+1,9); return {q:a+'-'+b,ans:a-b}; }
    else if(t==='a2_2nc'){ const a=rnd(10,99),b=rnd(10,99); if((a%10)+(b%10)<=9) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='a2_2c'){ const a=rnd(10,99),b=rnd(10,99); if((a%10)+(b%10)>=10) return {q:a+'+'+b,ans:a+b}; }
    else if(t==='s2_2nb'){ const a=rnd(10,99),b=rnd(10,99); if(a>=b && (a%10)>=(b%10)) return {q:a+'-'+b,ans:a-b}; }
    else if(t==='s2_2b'){ let a=rnd(10,99),b=rnd(10,99); if(a<b){ const t2=a;a=b;b=t2; } if((a%10)<(b%10)) return {q:a+'-'+b,ans:a-b}; }
    else if(t==='tens'){ if(Math.random()<0.5){ const a=rnd(1,9)*10,b=rnd(1,9)*10; return {q:a+'+'+b,ans:a+b}; } else { const a=rnd(2,9)*10,b=rnd(1,Math.floor(a/10))*10; return {q:a+'-'+b,ans:a-b}; } }
    else if(t==='mul'){ const a=rnd(1,9),b=rnd(1,9); return {q:a+'×'+b,ans:a*b}; }
  }
  const a=rnd(1,9),b=rnd(1,9); return {q:a+'+'+b,ans:a+b};
}
// ---------- 通用选择题（点选式，答错给一次重试，再错揭示正确答案） ----------
function choiceQ(body, opts){
  body.innerHTML='';
  const prog=document.createElement('div'); prog.className='qprog'; body.appendChild(prog);
  const refresh=()=>{ prog.textContent='第 '+opts.stat.idx+' / '+opts.stat.total+'　对 '+opts.stat.right+'　错 '+opts.stat.wrong; };
  refresh();
  body.appendChild(hintBubble(opts.hint));
  if(opts.speak){
    const sp=document.createElement('button');
    sp.className='speak-btn'; sp.type='button'; sp.textContent='🔊 听单词';
    sp.onclick=()=>{ try{ opts.speak(); }catch(e){} };
    body.appendChild(sp);
  }
  if(opts.head){ const hd=document.createElement('div'); hd.style.cssText='text-align:center;margin:6px 0'; hd.innerHTML=opts.head; body.appendChild(hd); }
  let tries=0;
  const wrap=document.createElement('div'); wrap.className='opts'; body.appendChild(wrap);
  opts.choices.forEach(label=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=label;
    b.onclick=()=>{
      if(label===opts.answer){
        b.classList.add('correct');
        [...wrap.children].forEach(x=> x.onclick=null);
        setTimeout(()=>{ opts.stat.right++; opts.onDone(true); }, 350);
      } else {
        b.classList.add('wrong','shake'); playTone('wrong');
        tries++;
        if(tries>=2){
          [...wrap.children].forEach(x=> x.onclick=null);
          [...wrap.children].forEach(x=>{ if(x.textContent===opts.answer) x.classList.add('correct'); });
          showFeedback(false, ()=> opts.onDone(false), '正确答案：'+opts.answer);
        } else {
          opts.stat.wrong++;
          showFeedback(false, null, '再想想～还有 '+(2-tries)+' 次机会');
          setTimeout(()=> b.classList.remove('wrong','shake'), 650);
        }
      }
    };
    wrap.appendChild(b);
  });
}
// ---------- 通用数学键盘题（大按钮数字键盘，答错给一次重试） ----------
function mathQ(body, opts){
  body.innerHTML='';
  const prog=document.createElement('div'); prog.className='qprog'; body.appendChild(prog);
  const refresh=()=>{ prog.textContent='第 '+opts.stat.idx+' / '+opts.stat.total+'　对 '+opts.stat.right+'　错 '+opts.stat.wrong; };
  refresh();
  body.appendChild(hintBubble(opts.hint));
  let input='';
  const eq=document.createElement('div'); eq.className='eq'; eq.innerHTML=esc(opts.q)+' = <span class="ans"></span>'; body.appendChild(eq);
  const kp=document.createElement('div'); kp.className='keypad';
  ['1','2','3','4','5','6','7','8','9','清除','0','✓'].forEach(k=>{
    const b=document.createElement('button'); b.textContent=k;
    if(k==='✓') b.className='ok'; if(k==='清除') b.className='cl';
    b.onclick=()=>{
      if(k==='清除') input='';
      else if(k==='✓'){ check(); return; }
      else if(input.length<5) input+=k;
      eq.querySelector('.ans').textContent=input;
    };
    kp.appendChild(b);
  });
  body.appendChild(kp);
  let tries=0;
  function check(){
    if(input==='') return;
    const ok = parseInt(input,10)===opts.ans;
    if(ok){
      opts.stat.right++;
      showFeedback(true, ()=> opts.onDone(true));
    } else {
      tries++; if(tries===1) opts.stat.wrong++;
      if(tries>=2){ showFeedback(false, ()=> opts.onDone(false), '正确答案 '+opts.ans); }
      else { showFeedback(false, null, '再想想～还有 '+(2-tries)+' 次机会'); input=''; eq.querySelector('.ans').textContent=''; }
    }
  }
}

// ---------- 语文闯关（看字选拼音 / 听音选字 / 组词填空 随机混合） ----------
function startHanziChallenge(){
  const c=S.challengeCfg.hanzi||{};
  const books=c.books||[];
  if(!books.length){ toast('请家长先到「家长中心 → 闯关配置」选择册'); return; }
  const qty=Math.max(1, c.qty||10);
  // 复习池 = 家长在闯关配置中选择的册里的全部字（不再依赖"学习完成"自动排程）
  const cids=[];
  for(const b of books){ for(const ch of ALLCH){ if(ch.id.indexOf('b'+b+'l')===0) cids.push(ch.id); } }
  if(!cids.length){ toast('请家长先到「家长中心 → 闯关配置」选择册'); return; }
  // 错题本：孩子答错过的字按艾宾浩斯再考，且同样只限家长选择的册
  const dueWrong=dueWrongHanzi().filter(cid=> books.some(b=> cid.indexOf('b'+b+'l')===0));
  const nWrong=Math.min(qty, dueWrong.length);
  const wrongPicks=shuffle(dueWrong).slice(0, nWrong);
  const wrongSet=new Set(wrongPicks);
  // 新字：已选册字 − 今日错题，随机抽
  const newPool=shuffle(cids.filter(cid=> !wrongSet.has(cid)));
  const nNew=Math.max(0, qty-nWrong);
  const newPicks=newPool.slice(0, nNew);
  // 合并打乱；标记哪些来自错题本（用于答对时推进间隔）
  const wrongFlag={}; wrongPicks.forEach(cid=> wrongFlag[cid]=true);
  const picks=shuffle(wrongPicks.concat(newPicks));
  const stat={idx:0,total:picks.length,right:0,wrong:0};
  function next(){
    if(stat.idx>=stat.total){ challengeEnd('hanzi', stat.right, stat.wrong, ()=>startHanziChallenge()); return; }
    const cid=picks[stat.idx]; const ch=CHMAP[cid]; stat.idx++;
    if(!ch){ return next(); }
    const body=$('hanziMenu');
    const type=HANZI_TYPES[Math.floor(Math.random()*HANZI_TYPES.length)];
    const spec=hanziQSpec(type, ch);
    const isWrong=!!wrongFlag[cid];
    choiceQ(body, {
      hint:spec.hint, head:spec.head, choices:spec.choices, answer:spec.answer, stat,
      onDone:(ok)=>{ updateWrongHanzi(cid, ok, isWrong); next(); },
      speak:spec.speak
    });
    if(spec.speak) setTimeout(()=>{ try{ spec.speak(); }catch(e){} }, 350);
  }
  next();
}
// ---------- 数学闯关（14 题型，数字键盘输入） ----------
function startMathChallenge(){
  const c=S.challengeCfg.math||{};
  const types=c.types||[];
  if(!types.length){ toast('请家长先到「家长中心 → 闯关配置」选择题型'); return; }
  const qty=c.qty||12;
  const qs=[];
  for(let i=0;i<qty;i++){ qs.push(genMathByType(types[i%types.length])); }
  shuffle(qs);
  const stat={idx:0,total:qs.length,right:0,wrong:0};
  const body=$('mathBody');
  function next(){
    if(stat.idx>=stat.total){ challengeEnd('math', stat.right, stat.wrong, ()=>startMathChallenge()); return; }
    const m=qs[stat.idx]; stat.idx++;
    $('mathStat').textContent='第 '+stat.idx+' / '+stat.total;
    mathQ(body,{hint:'🔢 算出答案，用键盘输入后按 ✓', q:m.q, ans:m.ans, stat, onDone:next});
  }
  next();
}

function startEnChallengeV2(){
  const words=enEnabledWords();

  const pool=shuffle(words).slice(0, Math.max(1,qty));
  const stat={idx:0,total:pool.length,right:0,wrong:0};
  function next(){
    if(stat.idx>=stat.total){ challengeEnd('en', stat.right, stat.wrong, ()=>startEnChallengeV2()); return; }
    const w=pool[stat.idx]; stat.idx++;
    const body=$('wordsBody');
    let type=['listen','pic','piczh','zh','listenzh'][Math.floor(Math.random()*5)];

      setTimeout(()=>speak(w.en,'en-US'),350);
    } else if(type==='pic'){
      const dist=shuffle(others.map(x=>x.en)).slice(0,3);
      choiceQ(body,{hint:'🖼️ 看图片，选出对应的英文', head:picHead, choices:shuffle([w.en].concat(dist)), answer:w.en, stat, onDone:next});
    } else if(type==='piczh'){
      const head=picHead+'<div class="qpinyin">'+esc(w.en)+'</div>';
      const dist=shuffle(others.map(x=>x.zh)).slice(0,3);
      choiceQ(body,{hint:'🔤 看图+英文，选出它的中文意思', head, choices:shuffle([w.zh].concat(dist)), answer:w.zh, stat, onDone:next});
    } else if(type==='listenzh'){
      const dist=shuffle(others.map(x=>x.zh)).slice(0,3);
      choiceQ(body,{hint:'🔊 听单词，选出它的中文意思', choices:shuffle([w.zh].concat(dist)), answer:w.zh, stat, onDone:next, speak:()=>speak(w.en,'en-US')});
      setTimeout(()=>speak(w.en,'en-US'),350);
    } else {
      const head='<div class="qchar" style="font-size:40px">'+esc(w.zh)+'</div>';
      const dist=shuffle(others.map(x=>x.en)).slice(0,3);
      choiceQ(body,{hint:'🔤 看中文，选出对应的英文', head, choices:shuffle([w.en].concat(dist)), answer:w.en, stat, onDone:next});
    }
  }
  next();
}

function updateWrongHanzi(cid, ok, isWrong){
  if(!cid || !CHMAP[cid]) return;
  if(!S.wrongHanzi || Array.isArray(S.wrongHanzi)) S.wrongHanzi={};

}

// 语文复习闯关：8 种题型（随机混合出题）
const HANZI_TYPES = ['char2pinyin','pinyin2char','listen','fillchar','wordfill','wordpick','word2pinyin','fillsent'];
// 根据题型 + 字，生成一道题的展示数据（head/hint/choices/answer/speak）
function hanziQSpec(type, ch){
  const others = learnedHanzi().filter(x=>x.c!==ch.c);
  const words = (ch.words && ch.words.length) ? ch.words : [ch.c+ch.c];
  const wp = (ch.wp && ch.wp.length) ? ch.wp : [ch.py];
  const verbSet='去来学做看吃喝玩写读听说跑走飞唱画洗扫想爱带拿放开见找给';
  let head='', hint='', choices=[], answer='', speakFn=null;
  if(type==='char2pinyin'){            // 看字选拼音
    head='<div class="qchar" style="font-size:48px">'+esc(ch.c)+'</div>';
    hint='👀 看这个字，选出它的拼音';
    const dist=shuffle(others.map(x=>x.py)).filter(p=>p&&p!==ch.py).slice(0,3);
    choices=shuffle([ch.py].concat(dist)); answer=ch.py;
  } else if(type==='pinyin2char'){     // 拼音选字
    head='<div class="qpinyin" style="font-size:30px">'+esc(ch.py)+'</div>';
    hint='🔤 看拼音，选出正确的字';
    const dist=shuffle(others.map(x=>x.c)).filter(c=>c&&c!==ch.c).slice(0,3);
    choices=shuffle([ch.c].concat(dist)); answer=ch.c;
  } else if(type==='listen'){          // 听音选字
    hint='🔊 听一听，选出正确的字'; speakFn=()=>speak(ch.c,'zh-CN');
    const dist=shuffle(others.map(x=>x.c)).filter(c=>c&&c!==ch.c).slice(0,3);
    choices=shuffle([ch.c].concat(dist)); answer=ch.c;
  } else if(type==='fillchar'){        // 句子填空（挖字）
    let sent = (ch.sent && ch.sent.indexOf(ch.c) >= 0) ? ch.sent : '';
    if(!sent){
      const w = words.find(x=>x.indexOf(ch.c)===0) || words[0];
      const rest = w.slice(1); const isV = verbSet.includes(rest[0]);
      sent = isV ? ('我＿'+rest+'了。') : ('这是＿'+rest+'。');
    }
    head='<div class="qsent">'+esc(sent.replace(ch.c,'＿'))+'</div>';
    hint='✏️ 句子里少了哪个字？选出来';
    const dist=shuffle(others.map(x=>x.c)).filter(c=>c&&c!==ch.c).slice(0,3);
    choices=shuffle([ch.c].concat(dist)); answer=ch.c;
  } else if(type==='wordfill'){        // 词组填空
    const w=words.find(x=>x.indexOf(ch.c)===0)||words[0];
    const blank=w.replace(ch.c,'＿');
    head='<div class="qchar" style="font-size:38px">'+esc(blank)+'</div>';
    hint='✏️ 把词补充完整';
    const dist=shuffle(others.map(x=>x.c)).filter(c=>c&&c!==ch.c).slice(0,3);
    choices=shuffle([ch.c].concat(dist)); answer=ch.c;
  } else if(type==='wordpick'){        // 选词题：选出能组词的字
    const w=words.find(x=>x.indexOf(ch.c)===0)||words[0];
    const pos=w.indexOf(ch.c); const partner=w.slice(0,pos)+w.slice(pos+1);
    head='<div class="qchar" style="font-size:40px">'+esc(ch.c)+'</div>';
    hint='🧩 选出能和这个字组成词的字';
    const bad=(c)=> (ch.c+c===w)||(c+ch.c===w);
    const dist=shuffle(others.map(x=>x.c)).filter(c=>c&&c!==ch.c&&!bad(c)&&!words.includes(ch.c+c)&&!words.includes(c+ch.c)).slice(0,3);
    choices=shuffle([partner].concat(dist)); answer=partner;
  } else if(type==='word2pinyin'){     // 看词选拼音
    const w=words[0]; const py=wp[0];
    head='<div class="qchar" style="font-size:34px">'+esc(w)+'</div>';
    hint='🔤 看这个词，选出它的拼音';
    const dist=shuffle(others.map(x=>(x.wp&&x.wp[0])||x.py)).filter(p=>p&&p!==py).slice(0,3);
    choices=shuffle([py].concat(dist)); answer=py;
  } else {                             // fillsent 句子填空（挖词）
    const w = words[0];
    let sent = (ch.wsent && w && ch.wsent.indexOf(w) >= 0) ? ch.wsent : '';
    if(!sent){
      const isV = verbSet.includes(w[w.length-1]) || verbSet.includes(w[1]);
      sent = isV ? ('我们一起来＿吧。') : ('这是我家的＿。');
    }
    head='<div class="qsent">'+esc(sent.replace(w,'＿'))+'</div>';
    hint='✏️ 句子里少了哪个词？选出来';
    const dist=shuffle(others.map(x=>(x.words&&x.words[0])||(x.c+x.c))).filter(x=>x&&x!==w).slice(0,3);
    choices=shuffle([w].concat(dist)); answer=w;
  }
  return {head,hint,choices,answer,speak:speakFn};
}

// ---------- 数学复习 ----------
function genMath(){
  const r=Math.random();
  if(r<0.45){ // 加法
    let a=Math.floor(Math.random()*100), b=Math.floor(Math.random()*100); return {q:a+'+'+b, ans:a+b};
  } else if(r<0.9){ // 减法
    let a=Math.floor(Math.random()*100), b=Math.floor(Math.random()*(a+1)); return {q:a+'-'+b, ans:a-b};
  } else { // 乘法
    let a=Math.floor(Math.random()*9)+1, b=Math.floor(Math.random()*9)+1; return {q:a+'×'+b, ans:a*b};
  }
}
let mathRight=0, mathWrong=0, mathCur=null, mathInput='', mathIndex=0, mathTotal=10, mathStrike=0;
function startMath(){ mathRight=0; mathWrong=0; mathInput=''; mathIndex=0; mathStrike=0; nextMath(); }
function nextMath(){
  mathIndex++;
  if(mathIndex>mathTotal){ markQuizDone('math'); showGameEnd('数学复习', mathRight, mathWrong, 'math', ()=>startMath(), mathStrike); return; }
  const muid=drawMathUid();
  if(!muid){ markQuizDone('math'); showGameEnd('数学复习', mathRight, mathWrong, 'math', ()=>startMath(), mathStrike); return; }
  mathCur=S.mathSchedule[muid]; mathCur.uid=muid; mathCur.tries=0; mathInput='';
  $('mathStat').textContent='第 '+mathIndex+' / '+mathTotal+'　对 '+mathRight+'　错 '+mathWrong;
  $('mathBody').innerHTML='';
  $('mathBody').appendChild(hintBubble(HINT.math));
  const eq=document.createElement('div'); eq.className='eq'; eq.innerHTML=esc(mathCur.q)+' = <span class="ans">'+mathInput+'</span>';
  $('mathBody').appendChild(eq);
  const kp=document.createElement('div'); kp.className='keypad';
  const keys=['1','2','3','4','5','6','7','8','9','清除','0','✓'];
  keys.forEach(k=>{
    const b=document.createElement('button'); b.textContent=k;
    if(k==='✓') b.className='ok'; if(k==='清除') b.className='cl';
    b.onclick=()=>{
      if(k==='清除'){ mathInput=''; }
      else if(k==='✓'){ checkMath(); return; }
      else { if(mathInput.length<4) mathInput+=k; }
      eq.querySelector('.ans').textContent=mathInput||'';
    };
    kp.appendChild(b);
  });
  $('mathBody').appendChild(kp);
}
function checkMath(){
  if(mathInput==='') return;
  const correct = parseInt(mathInput,10)===mathCur.ans;
  if(correct){
    mathRight++;
    if(mathCur && mathCur.uid) advanceSchedule(S.mathSchedule, mathCur.uid);
    $('mathStat').textContent='第 '+mathIndex+' / '+mathTotal+'　对 '+mathRight+'　错 '+mathWrong;
    showFeedback(true, ()=>nextMath());
  } else {
    mathWrong++;
    mathCur.tries=(mathCur.tries||0)+1;
    if(mathCur.tries>=3){
      mathStrike++;
      $('mathStat').textContent='第 '+mathIndex+' / '+mathTotal+'　对 '+mathRight+'　错 '+mathWrong;
      showFeedback(false, ()=>nextMath(), '正确答案 '+mathCur.ans);
    } else {
      mathInput='';
      const eq=$('mathBody').querySelector('.eq'); if(eq) eq.querySelector('.ans').textContent='';
      showFeedback(false, null, '再想想，还有 '+(3-mathCur.tries)+' 次机会');
    }
  }
}

// ---------- 自然拼读（牛津自然拼读世界 5 册） ----------
let phonicsBookOpen=null;
function renderPhonics(){
  const body=$('phonicsBody'); body.innerHTML='';
  const books = D.phonicsBooks || [];
  if(!books.length){ body.innerHTML='<div class="empty">暂无自然拼读课程数据</div>'; return; }

  // 统计进度
  function phonicsDone(book, n){
    return !!S.phonicsDone && S.phonicsDone['b'+book+'u'+n];
  }
  function totalDone(){
    let t=0;
    books.forEach((bk,bi)=> bk.forEach(u=> { if(phonicsDone(bi+1,u.n)) t++; }));
    return t;
  }
  let nextBook=1, nextUnit=1;
  outer: for(let bi=0; bi<books.length; bi++){
    for(const u of books[bi]){
      if(!phonicsDone(bi+1, u.n)){ nextBook=bi+1; nextUnit=u.n; break outer; }
    }
    if(bi===books.length-1) { nextBook=-1; } // all done
  }

  let h='<p style="font-size:13px;color:var(--sub);margin:2px 0 12px">自动推荐下一课（橙色边框）。学完点“学习完成”即记录进度。</p>';

  if(phonicsBookOpen===null){ phonicsBookOpen = nextBook>0 ? nextBook : 1; }

  const titles = {1:'The Alphabet 字母',2:'Short Vowels 短元音',3:'Long Vowels 长元音',4:'Consonant Blends 辅音组合',5:'Letter Combinations 字母组合'};

  books.forEach((bk, bi)=>{
    const bnum = bi + 1;
    const doneInBook = bk.filter(u => phonicsDone(bnum, u.n)).length;
    const open = phonicsBookOpen === bnum;
    const allDone = doneInBook === bk.length;
    h += `<div class="bookhead${open?' open':''}" data-book="${bnum}"><span class="bt">自然拼读 第${bnum}册 · ${titles[bnum]||''}</span><span class="bp">${allDone?'✓ 已学完':(doneInBook+' / '+bk.length+' Unit')}</span><span class="bc">${open?'▾':'▸'}</span></div>`;
    if(!open) return;
    bk.forEach(u => {
      const uid='b'+bnum+'u'+u.n;
      const done=phonicsDone(bnum,u.n);
      const rec=(!done && bnum===nextBook && u.n===nextUnit)?' rec':'';
      if(done){
        h+=`<div class="lesson${rec}"><div class="row1"><span class="ln">Unit ${u.n}</span><div class="lt">${esc(u.title)}</div><span class="st">✓ 已学</span></div></div>`;
      } else {
        h+=`<div class="lesson${rec}"><div class="row1"><span class="ln">Unit ${u.n}</span><div class="lt">${esc(u.title)}</div><button class="go" data-unit="${uid}">学习</button></div></div>`;
      }
    });
  });

  body.innerHTML = h;

  // 册头点击：手风琴展开/收起（一次一册）
  body.querySelectorAll('[data-book]').forEach(hd => {
    hd.onclick = () => {
      const bk=parseInt(hd.dataset.book,10);
      phonicsBookOpen = (phonicsBookOpen===bk) ? -1 : bk;
      renderPhonics();
    };
  });

  // 学习按钮 → 进入学习中页
  body.querySelectorAll('[data-unit]').forEach(btn => {
    if(btn.tagName==='BUTTON'){
      btn.onclick = () => beginPhonicsLesson(btn.dataset.unit);
    }
  });
}

// ---------- 摩比爱数学（探索篇 + 飞跃篇） ----------
let mathLevelOpen=null, mathBookOpen=null;
function renderMathBook(){
  const lvls = D.mathLevels || [];
  const body = $('mathBookBody'); body.innerHTML='';
  if(!lvls.length){ body.innerHTML='<div class="empty">暂无摩比爱数学课程数据</div>'; return; }

  function mDone(lv, lesson){ return !!S.mathDone && S.mathDone['m'+lv+'_'+lesson]; }
  function totalLessons(){ let t=0; lvls.forEach(L=> L.books.forEach(b=> t+=b.length)); return t; }
  function totalDone(){
    let t=0;
    lvls.forEach((L,li)=> L.books.forEach(b=> b.forEach(l=>{ if(mDone(li,l.n)) t++; })));
    return t;
  }
  // 下一课（按 探索篇→飞跃篇 顺序，每册 4 课）
  let nextLv=0, nextLesson=1, found=false;
  outer: for(let li=0; li<lvls.length; li++){
    for(const b of lvls[li].books){ for(const l of b){ if(!mDone(li,l.n)){ nextLv=li; nextLesson=l.n; found=true; break outer; } } }
  }
  if(!found) nextLv=-1;

  let h='<p style="font-size:13px;color:var(--sub);margin:2px 0 12px">自动推荐下一课（橙色边框）。学完点“学习完成”即记入进度。</p>';
  // 汇总
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">';
  h+='<div class="stat-card"><div class="stv">'+totalDone()+'</div><div class="std">已学课程</div></div>';
  h+='<div class="stat-card"><div class="stv" style="color:var(--orange)">'+totalLessons()+'</div><div class="std">总课程</div></div>';
  if(nextLv>=0)
    h+='<div class="stat-card" style="background:linear-gradient(135deg,#fff8e0,#ffefc0)"><div class="stv" style="color:#e65100;font-size:18px">'+esc(lvls[nextLv].name)+' 第'+nextLesson+'课</div><div class="std">下一课</div></div>';
  else
    h+='<div class="stat-card" style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9)"><div class="stv" style="color:#2e7d32">🎉</div><div class="std">全部学完!</div></div>';
  h+='</div>';

  if(mathLevelOpen===null) mathLevelOpen = found ? nextLv : 0;

  lvls.forEach((L, li)=>{
    const lvDone = L.books.reduce((a,b)=> a + b.filter(l=>mDone(li,l.n)).length, 0);
    const lvTotal = L.books.reduce((a,b)=> a + b.length, 0);
    const lvAll = lvDone===lvTotal;
    const lvNext = (li===nextLv);
    const lopen = mathLevelOpen===li;
    h += '<div class="bookhead'+(lvNext?' rec':'')+'" data-mlv="'+li+'">'
      + '<span class="bh-left"><span class="bh-arr">'+(lopen?'▼':'▶')+'</span><span>'+esc(L.name)+'</span></span>'
      + '<span class="bh-right">'+(lvAll?'✓ 已学完':(lvDone+' / '+lvTotal))+'</span></div>';
    if(!lopen) return;
    L.books.forEach((b, bi)=>{
      const bnum = bi+1;
      const bDone = b.filter(l=>mDone(li,l.n)).length;
      const bAll = bDone===b.length;
      const bNext = lvNext && b.some(l=> l.n===nextLesson);
      const bkey = li+'-'+bnum;
      const bopen = (mathBookOpen!==null) ? (mathBookOpen===bkey) : bNext;
      h += '<div class="bookhead'+(bNext?' rec':'')+'" data-mbk="'+bkey+'" style="margin-left:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px">'
        + '<span class="bh-left"><span class="bh-arr">'+(bopen?'▼':'▶')+'</span><span>第 '+bnum+' 册</span></span>'
        + '<span class="bh-right">'+(bAll?'✓ 已学完':(bDone+' / '+b.length))+'</span></div>';
      if(!bopen) return;
      b.forEach(l=>{
        const uid='m'+li+'_'+l.n;
        const done=mDone(li,l.n);
        const rec=(!done && li===nextLv && l.n===nextLesson)?' rec':'';
        h += '<div class="lesson'+rec+'" style="margin-left:28px">'
          + '<span class="ln">第'+l.n+'课</span>'
          + '<div class="lt">'+esc(l.title)+'</div>'
          + (done?'<span class="st">✓已学</span>':'<button class="go" data-muid="'+uid+'">学习</button>')
          + '</div>';
      });
    });
  });
  body.innerHTML=h;

  body.querySelectorAll('[data-mlv]').forEach(el=> el.onclick=()=>{
    const li=parseInt(el.dataset.mlv,10);
    mathLevelOpen = (mathLevelOpen===li)? -1 : li;
    renderMathBook();
  });
  body.querySelectorAll('[data-mbk]').forEach(el=> el.onclick=()=>{
    const k=el.dataset.mbk;
    mathBookOpen = (mathBookOpen===k)? null : k;
    renderMathBook();
  });
  body.querySelectorAll('[data-muid]').forEach(btn=> btn.onclick=()=> beginMathLesson(btn.dataset.muid));
}

function beginMathLesson(uid){
  const m = uid.match(/^m(\d+)_(\d+)$/);
  if(!m) return;
  const lv=parseInt(m[1],10), lesson=parseInt(m[2],10);
  const L=(D.mathLevels||[])[lv]; if(!L) return;
  const book=Math.ceil(lesson/4);
  let info=null;
  L.books.forEach(b=> b.forEach(l=>{ if(l.n===lesson) info=l; }));
  if(!info) return;

  sessTaskId='mathbook'; sessSec=0; sessRunning=true;
  $('sessTitle').textContent='摩比爱数学';
  $('sessTask').textContent=L.name+' 第'+book+'册 第'+lesson+'课';
  $('sessEnc').textContent=info.title;
  $('sessEnc2').textContent='跟着书做一做、想一想，做完点“学习完成”🦕';
  startTimer(); openPage('pgSession');

  $('sessFinish').onclick = () => {
    clearInterval(sessTimer);
    if(!S.mathDone) S.mathDone={};
    S.mathDone[uid]=today();
    const t=today();
    const ha=S.doneDates['mathbook']||(S.doneDates['mathbook']=[]);
    if(!ha.includes(t)) ha.push(t);
    save();
    addPoints(2, '摩比爱数学 '+L.name+' 第'+book+'册第'+lesson+'课');
    toast('🎉 摩比爱数学学习完成 +2 ⭐');
    closePage(); currentNav='home'; renderHome(); checkMedals();
  };
}

function phonicsQuiz(body){
  const fams=[]; D.phonics.forEach(v=> v.families.forEach(f=> fams.push(f)));
  const pick=shuffle(fams).slice(0,8);
  let i=0, right=0, wrong=0;
  function step(){
    if(i>=pick.length){ markQuizDone('en'); showGameEnd('自然拼读', right, wrong, 'en', ()=>renderPhonics()); return; }
    const f=pick[i];
    body.innerHTML='';
    const p=document.createElement('div'); p.className='qprog'; body.appendChild(p);
    const refresh=()=>{ p.textContent=(i+1)+'/'+pick.length+' 听音节，选出拼写　对 '+right+'　错 '+wrong; };
    refresh();
    body.appendChild(hintBubble(HINT.phonics));
    const sb=document.createElement('button'); sb.className='speak-btn'; sb.textContent='🔊 听音节'; sb.onclick=()=>speak(f.syl,'en-US',0.55); body.appendChild(sb);
    setTimeout(()=>speak(f.syl,'en-US',0.55), 350);
    let qWrong=0;
    const opts=pickOpts(f.syl, fams.map(x=>x.syl));
    body.appendChild(buildOpts(opts, f.syl, ()=>{
      right++;
      if(qWrong>=2 && !S.wrongPhonics.includes(f.syl)) S.wrongPhonics.push(f.syl); // 卡住才进错题本
      save();
      showFeedback(true, ()=> { i++; step(); });
    }, null, ()=> { qWrong++; wrong++; refresh(); }));
  }
  step();
}

let wordRight=0, wordWrong=0, wordCur=null;
function startWords(mode){
  wordRight=0; wordWrong=0;
  let pool;
  if(mode==='wrong'){ pool = ENWORDS.filter(w=>S.wrongEn.includes(w.en)); if(!pool.length){ toast('还没有错题哦'); renderEnMenu(); openPage('pgEnMenu'); return; } }
  else if(mode==='all'){ pool = learnedEn(); if(!pool.length){ toast('还没有学过的单词哦'); renderEnMenu(); openPage('pgEnMenu'); return; } }
  else { pool = dueEn(); if(!pool.length) pool = learnedEn(); if(!pool.length){ toast('还没有学过的单词哦，先去自然拼读学一学吧'); renderEnMenu(); openPage('pgEnMenu'); return; } }
  runWord('listen', pool, 0);
}
function runWord(mode, pool, idx){
  if(idx>=10){ markQuizDone('en'); showGameEnd('英语单词', wordRight, wordWrong, 'en', ()=>renderEnMenu()); return; }
  const w=pool[Math.floor(Math.random()*pool.length)];
  wordCur=w;
  const body=$('wordsBody'); body.innerHTML='';
  const prog=document.createElement('div'); prog.className='qprog'; body.appendChild(prog);
  const modes=['listen','pic','zh'];
  const m = modes[idx%3];
  body.appendChild(hintBubble(HINT['en_'+m]));
  let qWrong=0;
  const refresh=()=>{ prog.textContent=(idx+1)+' / 10　对 '+wordRight+'　错 '+wordWrong; };
  refresh();
  const reveal=()=>{
    const rv=document.createElement('div'); rv.className='reveal show';
    rv.innerHTML='<div class="em">'+(w.em||'📝')+'</div><div class="en">'+esc(w.en)+'</div><div class="zh">'+esc(w.zh)+'</div>';
    body.appendChild(rv);
    const nb=document.createElement('button'); nb.className='next-btn'; nb.textContent='下一题 →';
    nb.onclick=()=> runWord(mode, pool, idx+1);
    body.appendChild(nb);
    speak(w.en,'en-US');
  };
  const resolve=()=>{
    wordRight++;
    if(qWrong>=2 && !S.wrongEn.includes(w.en)) S.wrongEn.push(w.en); // 卡住才进错题本
    if(!S.enSchedule[w.en]) S.enSchedule[w.en]={due:addDays(0), level:0};
    advanceSchedule(S.enSchedule, w.en); // 艾宾浩斯：最终答对则提升复习等级
    save();
    showFeedback(true, reveal);
  };
  const onWrong=()=>{ qWrong++; wordWrong++; refresh(); };
  if(m==='listen'){
    const sb=document.createElement('button'); sb.className='speak-btn'; sb.textContent='🔊 听单词'; sb.onclick=()=>speak(w.en,'en-US'); body.appendChild(sb);
    setTimeout(()=>speak(w.en,'en-US'), 350);
    const opts=pickOpts(w.en, ENWORDS.map(x=>x.en));
    body.appendChild(buildOpts(opts, w.en, resolve, null, onWrong));
  } else if(m==='pic'){
    const em=document.createElement('div'); em.className='qchar'; em.style.fontSize='70px'; em.textContent=w.em||'📝'; body.appendChild(em);
    const opts=pickOpts(w.en, ENWORDS.map(x=>x.en));
    body.appendChild(buildOpts(opts, w.en, resolve, null, onWrong));
  } else {
    const en=document.createElement('div'); en.className='qchar'; en.style.fontSize='40px'; en.textContent=w.en; body.appendChild(en);
    const opts=pickOpts(w.zh, ENWORDS.map(x=>x.zh));
    body.appendChild(buildOpts(opts, w.zh, resolve, null, onWrong));
  }
}

// 已学自然拼读课程里的音节（按 Syllable family 取），用于音节练习出题
function learnedSyllables(){
  const out=new Set();
  const books=D.phonicsBooks||[];
  if(!S.phonicsDone) return [];
  const famSet=new Set(); D.phonics.forEach(v=> v.families.forEach(f=> famSet.add(f.syl)));
  for(const uid in S.phonicsDone){
    const m=uid.match(/^b(\d+)u(\d+)$/); if(!m) continue;
    const bi=parseInt(m[1],10)-1, un=parseInt(m[2],10);
    const bk=books[bi]; if(!bk) continue;
    const u=bk.find(x=>x.n===un); if(!u||!u.sounds) continue;
    u.sounds.forEach(s=>{ if(famSet.has(s)) out.add(s); });
  }
  return [...out];
}
let enChal=null;
// 入口：点击英语复习卡直接进大闯关（不再进选课菜单）
function startEnChallenge(){
  if(!ENWORDS.length){ toast('词库为空'); return; }
