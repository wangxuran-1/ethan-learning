// ---------- 首页：今日加分清单（孩子视角：今天能赚哪些分 + 完成情况） ----------
const BONUS_REASONS=['奖励·三科闯关全完成','奖励·学习任务全勤','奖励·好习惯全勤','奖励·全能宝宝','奖励·每日三件套'];
function isBonusReason(r){ return BONUS_REASONS.indexOf(r)>=0; }
function _learnDoneToday(t){
  const hanzi=(S.doneDates['hanzi']||[]).includes(t);
  // 自然拼读兼容旧数据（S.phonicsDone）与新数据（doneDates['phonics']）
  const ph=(S.doneDates['phonics']||[]).includes(t) || Object.keys(S.phonicsDone||{}).some(u=> S.phonicsDone[u]===t);
  const math=(S.doneDates['mathbook']||[]).includes(t);
  const coreAll=hanzi&&ph&&math;
  // 清单行统计所有配置的学习任务（含 generic），不再只硬编码 3 科
  const list=S.tasks.learning||[];
  let count=0, total=list.length;
  list.forEach(tk=>{
    const done = tk.sub==='phonics'
      ? ((S.doneDates[tk.id]||[]).includes(t) || Object.keys(S.phonicsDone||{}).some(u=> S.phonicsDone[u]===t))
      : (S.doneDates[tk.id]||[]).includes(t);
    if(done) count++;
  });
  return {hanzi:hanzi, ph:ph, math:math, any:count>0, all:total>0&&count===total, coreAll:coreAll, count:count, total:total};
}
function _chalDoneToday(t){
  const b=['hanzi','math','en'];
  const done=b.filter(x=> S.quizDone && S.quizDone[x]===t).length;
  return {done:done, any:done>0, all:done===3};
}
function _habitDoneToday(t){
  const hs=S.tasks.lifeHabits||[];
  const c=hs.filter(h=> (S.doneDates[h.id]||[]).includes(t)).length;
  return {count:c, total:hs.length, any:c>0, all:hs.length>0 && c===hs.length};
}
function scoreBonusStatus(t){
  const L=_learnDoneToday(t), C=_chalDoneToday(t), H=_habitDoneToday(t);
  return [
    {name:'三科闯关全完成', pts:5,  done:C.all,  desc:'把语文、数学、英语闯关都各玩一次'},
    {name:'学习任务全勤',   pts:5,  done:L.coreAll,  desc:'摩比爱识字、自然拼读、摩比爱数学 都各完成 1 课'},
    {name:'好习惯全勤',     pts:3,  done:H.all,  desc:'今天的好习惯全都打勾完成'},
    {name:'全能宝宝',       pts:10, done:C.all&&L.coreAll&&H.all, desc:'闯关三科 + 学习任务 + 好习惯 全部完成！'},
    {name:'每日三件套',     pts:5,  done:L.any&&H.any&&C.any, desc:'学习任务、好习惯、闯关 今天都至少完成 1 项'}
  ];
}
function checkDailyBonuses(){
  if(S._bc) return; S._bc=true;
  try{
    const t=today();
    const log=S.pointLog[t]||(S.pointLog[t]={earn:0,spend:0,items:[]});
    const has=(r)=> log.items.some(x=> x.r===r && x.n>0);
    const give=(r,n)=>{ if(!has(r)){ addPoints(n,r); return true; } return false; };
    const L=_learnDoneToday(t), C=_chalDoneToday(t), H=_habitDoneToday(t);
    const newly=[];
    if(C.all && give('奖励·三科闯关全完成',5))  newly.push('三科闯关全完成 +5');
    if(L.coreAll && give('奖励·学习任务全勤',5))    newly.push('学习任务全勤 +5');
    if(H.all && give('奖励·好习惯全勤',3))      newly.push('好习惯全勤 +3');
    if(C.all&&L.coreAll&&H.all && give('奖励·全能宝宝',10)) newly.push('全能宝宝 +10');
    if(L.any&&H.any&&C.any && give('奖励·每日三件套',5)) newly.push('每日三件套 +5');
    if(newly.length){
      save();
      toast('🏆 额外奖励达成！');
      setTimeout(()=> showBonusCelebration(newly), 450);
    }
  } finally { S._bc=false; }
}

function buildScoreChecklistHTML(){
  const t=today();
  const L=_learnDoneToday(t), C=_chalDoneToday(t), H=_habitDoneToday(t);
  const row=(ic,name,per,statusDone,detail)=>{
    const state = statusDone
      ? '<span class="sc-state done">✅ 今日有完成'+(detail?' · '+detail:'')+'</span>'
      : '<span class="sc-state">⬜ 还没完成，去赚星星吧！</span>';
    return '<div class="sc-card'+(statusDone?' done':'')+'">'+
      '<div class="sc-emoji">'+ic+'</div>'+
      '<div class="sc-info"><div class="sc-name">'+name+'</div>'+
        '<span class="sc-pill">每完成 1 项 +'+per+'</span>'+state+'</div>'+
    '</div>';
  };
  let h='<div class="sc-list">';
  h+=row('📚','学习任务','2', L.any, L.count+'/'+L.total+' 项');
  h+=row('✅','好习惯','1', H.any, H.total?(''+H.count+'/'+H.total):'');
  h+=row('🎮','闯关','3', C.any, C.done+'/3 科');
  h+='</div>';
  const bs=scoreBonusStatus(t);
  h+='<div class="sc-bonus-title">🏆 额外奖励（达成自动 +分）</div>';
  h+='<div class="sc-bonus-list">';
  bs.forEach(x=>{
    h+='<div class="sc-bonus'+(x.done?' done':'')+'"><div class="sc-bonus-main"><span class="sc-bonus-ic">🏅</span><span class="sc-bonus-name">'+x.name+' <b>+'+x.pts+'</b></span><span class="sc-badge'+(x.done?'':' pend')+'">'+(x.done?'已达成':'未达成')+'</span></div><div class="sc-bonus-desc">'+esc(x.desc)+'</div></div>';
  });
  h+='</div>';
  const items=(S.pointLog[t]&&S.pointLog[t].items)||[];
  const bonusEarn=items.filter(it=> it.n>0 && isBonusReason(it.r)).reduce((s,it)=>s+it.n,0);
  if(bonusEarn>0) h+='<div class="sc-bonus-sum">🎁 今日已额外获得 +'+bonusEarn+' 分</div>';
  return h;
}

function doneCount(id){ return (S.doneDates[id]||[]).length; }
function learnedMathCount(){ return Object.keys(S.mathSchedule||{}).length; }
function learnedHanziCount(){ return learnedHanzi().length; }
function learnedEnCount(){ return learnedEn().length; }

function activeDaysByMonth(){
  const map=new Map();
  const add=k=>{ const ym=k.slice(0,7); if(!map.has(ym)) map.set(ym,new Set()); map.get(ym).add(k); };
  for(const id in S.doneDates){ (S.doneDates[id]||[]).forEach(add); }
  const out={}; map.forEach((v,ym)=> out[ym]=v.size); return out;
}
function isConsecutiveMonth(a,b){
  const [ya,ma]=a.split('-').map(Number), [yb,mb]=b.split('-').map(Number);
  if(yb===ya && mb===ma+1) return true;
  if(mb===1 && ma===12 && yb===ya+1) return true;
  return false;
}
function twoMonthFull(){
  const m=activeDaysByMonth(); const keys=Object.keys(m).sort();
  for(let i=1;i<keys.length;i++){ if(isConsecutiveMonth(keys[i-1],keys[i]) && m[keys[i-1]]>=28 && m[keys[i]]>=28) return true; }
  return false;
}
function allSixOneDay(){
  const L=S.tasks.learning||[]; if(L.length<6) return false;
  let inter=new Set(S.doneDates[L[0].id]||[]);
  for(let i=1;i<L.length;i++){ const n=new Set(); (S.doneDates[L[i].id]||[]).forEach(d=>{ if(inter.has(d)) n.add(d); }); inter=n; if(inter.size===0) return false; }
  return inter.size>0;
}

function checkMedals(silent){
  let changed=false;
  HONORS.forEach(h=>{
    let c; try{ c=h.cur(S); }catch(e){ c=0; }
    if(c>=h.goal && !S.medals[h.id]){
      S.medals[h.id]=today();
      changed=true;
      if(!silent) toast('🏅 解锁荣誉：'+h.t);
    }
  });
  save();
}

// 把一次性迁移 + 荣誉评估封装成 runMigrations()，加载时跑一次，导入备份后也会重跑（套用新版所有升级）。
function runMigrations(){
  // ---------- 7月历史数据一次性回填（已删除幼儿园课程/摩比思维机）----------
  // 仅当尚未回填过(seedVersion !== 'july2026')时写入；写入一次后标记，之后不再覆盖新数据
  if(S.seedVersion !== 'july2026'){
    Object.assign(S, JULY_SEED);
    S.seedVersion = 'july2026';
    save();
  }
  // 一次性补录「火箭积木玩具」兑换记录（650 积分），并同步扣减可用积分
  if(!S.rewardSeedDone){
    S.rewardLog.push({name:'火箭积木玩具', pts:650, date: today(), img:'assets/jpg_619.jpg'});
    S.points = Math.max(0, (S.points||0) - 650);
    S.rewardSeedDone = true;
    save();
  }
  // 一次性重置：识字/数学荣誉原按"已学数量"点亮，现改为按"复习闯关次数"判定。
  // 清掉这两类在旧指标下已点亮的记录，使其随真实闯关活动重新点亮。仅执行一次。
  if(!S.honorResetQuiz){
    ['hanzi5','hanzi10','hanzi25','hanzi50','hanzi100','hanzi200','hanzi400','hanzi700','hanzi1000','hanzi1500',
     'math5','math10','math20','math30','math50','math100','math200','math400','math800','math1500'
    ].forEach(id=>{ if(S.medals && S.medals[id]) delete S.medals[id]; });
    S.honorResetQuiz = true;
    save();
  }
  // 自修复：S.points 始终与“累计获得 - 已兑换”对齐（从得分记录反推，不丢分）。
  // 早期的一处“一次性迁移”曾在还没有种子数据时就把 flag 置位、导致之后再也不修复，
  // 历史数据里的 S.points 因此卡在旧值（如 750）。改为每次加载都对齐：
  // 正常操作后 S.points 与记录本就同步，此步仅纠偏历史脏数据，对正常数据无副作用。
  S.points = Math.max(0, totalEarned() - totalRedeemed());
  S.pointsRepaired = true;
  save();
  // 一次性修复：补全「火箭积木玩具」兑换记录的图片（原 base64 已损坏丢失）
  if(!S.rocketImgFixed){
    (S.rewardLog||[]).forEach(function(r){
      if(r && r.name==='火箭积木玩具' && (!r.img || r.img.indexOf('blob_id')>=0 || r.img.length<500)){
        r.img = 'assets/jpg_620.jpg';
      }
    });
    S.rocketImgFixed = true;
    save();
  }
  checkMedals(true); // 静默评估所有荣誉（不弹 toast）
}
